kafka_brokers=127.0.0.1:9092
kafka_consumer_group=spark_push_group
kafka_push_topic=push_to_comet
kafka_broadcast_topic=broadcast_task
comet_targets=comet-1=127.0.0.1:9205

# Job Kafka 消费并行度与单 consumer 最大在途消息数
# 同一 partition 保序，不同 partition 并行；达到上限时停止拉取形成背压
job_worker_threads=4
job_max_inflight=1024

# 推送模式: false=可靠的unary RPC, true=流模式(高吞吐但需要重连)
use_push_stream=false

# MySQL配置（异步落盘）
mysql_host=localhost
mysql_port=3306
mysql_user=root
mysql_password=123456
mysql_db=spark_push
mysql_pool_size=8


# 日志级别: TRACE/DEBUG/INFO/WARN/ERROR/FATAL(压测/生产建议 WARN,避免热路径日志拖累)
log_level=WARN
