listen_addr=0.0.0.0
listen_port=9100
http_port=9101
kafka_brokers=127.0.0.1:9092
kafka_push_topic=push_to_comet
kafka_broadcast_topic=broadcast_task
redis_host=127.0.0.1
redis_port=6379
redis_password=
redis_db=0
redis_pool_size=16
mysql_host=localhost
mysql_port=3306
mysql_user=root
mysql_password=123456
mysql_db=spark_push
mysql_pool_size=16

# HTTP服务器IO线程数
http_threads=4

# ---- 媒体对象存储（MinIO / S3，path-style） ----
# endpoint 是 Logic/worker 内部访问地址；public_endpoint 返回给浏览器直传/下载。
# 本地开发二者相同；部署到容器/公网时把 public_endpoint 改成浏览器可达地址。
s3_endpoint=http://127.0.0.1:9002
s3_public_endpoint=http://127.0.0.1:9002
s3_bucket=sparkpush-media
s3_access_key=minioadmin
s3_secret_key=minioadmin
s3_region=us-east-1
s3_presign_ttl_seconds=900
s3_path_style=true

# 图片 / 视频 / 文件限制
media_max_image_bytes=20971520
media_max_video_bytes=104857600
media_max_file_bytes=52428800
media_max_pixels=50000000
media_max_side=12000
media_download_url_ttl_seconds=900
media_task_max_attempts=3

# 日志级别: TRACE/DEBUG/INFO/WARN/ERROR/FATAL(压测/生产建议 WARN,避免热路径日志拖累)
log_level=WARN
