listen_addr=0.0.0.0
listen_port=9100
http_port=9101
kafka_brokers=127.0.0.1:9092
kafka_push_topic=push_to_comet
kafka_broadcast_topic=broadcast_task
kafka_ai_trigger_topic=ai_trigger

# ---- P6 AI Companion ----
# 私人助手/气氛组两个 bot 的固定 user_id，必须与迁移脚本种子一致。
ai_private_bot_user_id=910000000000001
ai_shared_bot_user_id=910000000000002
# AI Worker 调用 Logic /internal/ai/* 时使用的 Bearer token。
ai_internal_token=dev-internal-token
ai_context_message_limit=30
redis_host=127.0.0.1
redis_port=6379
redis_password=
redis_db=0
redis_pool_size=16
mysql_host=localhost
mysql_port=3306
mysql_user=root
mysql_password=123456
mysql_db=spark_push
mysql_pool_size=16

# HTTP服务器IO线程数（只负责收发，不做阻塞业务）
http_threads=4
# HTTP业务线程池：阻塞 DB/Redis/S3 handler 在这里执行
http_worker_threads=8

# ---- 媒体对象存储（MinIO / S3，path-style） ----
# endpoint 是 Logic/worker 内部访问地址；public_endpoint 返回给浏览器直传/下载。
# 本地开发二者相同；部署到容器/公网时把 public_endpoint 改成浏览器可达地址。
s3_endpoint=http://127.0.0.1:9002
s3_public_endpoint=http://127.0.0.1:9002
s3_bucket=sparkpush-media
s3_access_key=minioadmin
s3_secret_key=minioadmin
s3_region=us-east-1
s3_presign_ttl_seconds=900
s3_path_style=true

# 图片 / 视频 / 文件限制
media_max_image_bytes=20971520
media_max_video_bytes=104857600
media_max_file_bytes=52428800
media_max_pixels=50000000
media_max_side=12000
media_download_url_ttl_seconds=900
media_task_max_attempts=3

# 媒体元数据 Redis 缓存（只缓存 DB 字段和变体 object_key，不缓存签名 URL）
media_cache_enabled=true
media_cache_ready_ttl_seconds=600
media_cache_failed_ttl_seconds=60
media_cache_pending_ttl_seconds=1

# 缩略图/预览图/视频封面的公开 CDN 前缀；为空则继续使用预签名 URL。
# 本地直接指向 MinIO 的 path-style bucket，生产改成 CDN 域名。
media_variant_cdn_base_url=http://127.0.0.1:9002/sparkpush-media

# 视频 multipart 上传
media_multipart_part_size_bytes=8388608
media_multipart_upload_ttl_seconds=86400
media_upload_url_ttl_seconds=900

# 日志级别: TRACE/DEBUG/INFO/WARN/ERROR/FATAL(压测/生产建议 WARN,避免热路径日志拖累)
log_level=WARN
