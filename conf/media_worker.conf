# media_worker：异步媒体处理进程（图片生成 micro/thumb/preview；视频探测元数据 + 抽取封面）
mysql_host=localhost
mysql_port=3306
mysql_user=root
mysql_password=123456
mysql_db=spark_push
mysql_pool_size=8

# MinIO / S3（path-style）
s3_endpoint=http://127.0.0.1:9002
s3_public_endpoint=http://127.0.0.1:9002
s3_bucket=sparkpush-media
s3_access_key=minioadmin
s3_secret_key=minioadmin
s3_region=us-east-1
s3_presign_ttl_seconds=900
s3_path_style=true

# 图片限制与 worker 行为
media_max_image_bytes=20971520
media_max_pixels=50000000
media_max_side=12000
# 图片 / 视频独立 worker 线程数
media_image_worker_threads=3
media_video_worker_threads=1
media_worker_poll_ms=100
media_task_max_attempts=3
# 图片解码并发内存预算（MiB）；<=0 表示不限制
media_memory_budget_mb=1024

# 公开变体（micro/thumb/preview/poster）上传时的 Cache-Control。
# 只有这四类对象会被 MinIO 匿名只读策略命中；原图/文件/playback 不公开。
media_variant_cache_control=public, max-age=31536000, immutable

# 过期 multipart 上传清理；本地演示可改小，生产建议 3600
media_multipart_cleanup_interval_seconds=3600
media_multipart_cleanup_batch=100
# status=init 且超过该时长的单次 PUT 孤儿媒体清理
media_upload_orphan_ttl_seconds=86400

# 视频限制与服务端处理参数（HEVC MP4 会自动转码为 H.264/AAC）
media_max_video_bytes=104857600
media_max_video_duration_ms=600000
media_max_video_pixels=8294400
media_max_video_side=3840
media_video_poster_max_width=640
media_video_process_timeout_seconds=60
# 单次 ffmpeg 转码超时；输出大小上限复用 media_max_video_bytes
media_video_transcode_timeout_seconds=600
media_video_transcode_max_side=1920
media_video_transcode_crf=23
media_video_transcode_preset=veryfast
media_video_ffprobe_path=ffprobe
media_video_ffmpeg_path=ffmpeg
media_video_temp_dir=/tmp

# 日志级别
log_level=INFO

# 注意：media_worker 不需要 Kafka/Redis；LoadConfig 允许缺少这些配置。
