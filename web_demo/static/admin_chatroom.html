<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MsgRail · 管理后台</title>
  <meta name="description" content="MsgRail 分布式消息推送系统 · 管理后台" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%232563eb'/%3E%3Cpath d='M5 17V8l7 4.5L19 8v9' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="ui/tokens.css" />
  <link rel="stylesheet" href="ui/base.css" />
  <link rel="stylesheet" href="ui/admin.css" />
  <script src="ui/theme.js"></script>
  <script src="ui/icons.js"></script>
  <script src="auth.js"></script>
</head>
<body class="admin-app">
  <div class="admin-shell">
    <header class="admin-header">
      <a class="brand" href="index.html" aria-label="MsgRail 消息中心">
        <span class="brand-mark">
          <svg class="mr-icon" aria-hidden="true"><use href="#i-logo"></use></svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">MsgRail</span>
          <span class="brand-sub">分布式消息推送系统</span>
        </span>
      </a>
      <span class="mr-pill mr-pill-accent">管理后台</span>
      <div id="user-info" class="admin-user hidden">
        管理员 <span id="admin-id"></span>
        <button class="mr-btn mr-btn-ghost mr-btn-sm" type="button" onclick="doLogout()">退出</button>
      </div>
      <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="切换到深色模式" title="切换到深色模式">
        <svg class="mr-icon icon-sun" aria-hidden="true"><use href="#i-sun"></use></svg>
        <svg class="mr-icon icon-moon" aria-hidden="true"><use href="#i-moon"></use></svg>
      </button>
    </header>

    <!-- 登录卡片 -->
    <section id="login-card" class="mr-card admin-login">
      <div class="admin-login-copy">
        <span class="mr-eyebrow">Admin Console</span>
        <h1>管理员登录</h1>
        <p>登录后可创建聊天室、查看房间列表，并向全站或指定房间发送系统广播。</p>
        <ul class="admin-login-points">
          <li><svg class="mr-icon" aria-hidden="true"><use href="#i-check"></use></svg>创建与管理房间</li>
          <li><svg class="mr-icon" aria-hidden="true"><use href="#i-check"></use></svg>全站 / 房间广播</li>
          <li><svg class="mr-icon" aria-hidden="true"><use href="#i-check"></use></svg>一键生成分享链接</li>
        </ul>
      </div>
      <div class="admin-login-form">
        <div class="mr-field">
          <label class="mr-label" for="acc">账号</label>
          <input id="acc" class="form-control" placeholder="admin" autocomplete="username" />
          <span class="mr-muted mr-small">默认账号 admin，密码 admin123</span>
        </div>
        <div class="mr-field">
          <label class="mr-label" for="pwd">密码</label>
          <input id="pwd" type="password" class="form-control" placeholder="输入管理员密码" autocomplete="current-password" />
        </div>
        <button class="mr-btn mr-btn-primary" type="button" onclick="doLogin()">登录</button>
        <div id="err-msg" class="admin-error" role="alert"></div>
      </div>
    </section>

    <!-- 主控面板 (默认隐藏) -->
    <div id="dashboard" class="hidden">
      <div class="admin-grid">
        <!-- 创建房间 -->
        <section class="mr-card">
          <h3 class="mr-card-title">创建聊天室</h3>
          <p class="mr-card-hint">房间创建后可直接分享给其他用户加入。</p>
          <div class="mr-field">
            <label class="mr-label" for="new-room-name">房间名称</label>
            <input id="new-room-name" class="form-control" placeholder="例如：技术交流群" />
          </div>
          <button class="mr-btn mr-btn-primary" type="button" onclick="createRoom()">创建</button>
          <div id="create-res" class="admin-success" role="status"></div>
        </section>

        <!-- 广播 -->
        <section class="mr-card">
          <h3 class="mr-card-title">全站 / 房间广播</h3>
          <p class="mr-card-hint">广播会通过推送通道即时下发到在线客户端。</p>
          <div class="mr-field">
            <label class="mr-label" for="bc-scope">范围</label>
            <select id="bc-scope" class="mr-select">
              <option value="all">全站广播（所有在线）</option>
              <option value="chatroom">指定房间</option>
            </select>
          </div>
          <div class="mr-field">
            <label class="mr-label" for="bc-room-id">房间 ID（仅指定房间时有效）</label>
            <input id="bc-room-id" class="form-control" placeholder="例如：1001" />
          </div>
          <div class="mr-field">
            <label class="mr-label" for="bc-text">广播内容</label>
            <textarea id="bc-text" class="mr-textarea" rows="3" placeholder="输入要推送的广播内容..."></textarea>
          </div>
          <button class="mr-btn mr-btn-primary" type="button" onclick="sendBroadcast()">发送广播</button>
        </section>
      </div>

      <section class="mr-card admin-rooms">
        <div class="admin-section-head">
          <div>
            <h3 class="mr-card-title">房间列表</h3>
            <p>管理已创建的房间并复制分享链接。</p>
          </div>
          <button class="mr-btn mr-btn-secondary mr-btn-sm" type="button" onclick="loadRooms()">
            <svg class="mr-icon" aria-hidden="true"><use href="#i-refresh"></use></svg>
            刷新
          </button>
        </div>
        <div id="room-list" class="admin-room-list">
          <div class="admin-empty">加载中...</div>
        </div>
      </section>
    </div>
  </div>

  <!-- 分享弹窗 -->
  <div id="share-modal" class="mr-overlay hidden">
    <div class="mr-modal" role="dialog" aria-modal="true" aria-labelledby="share-modal-title">
      <div class="mr-modal-header">
        <span class="mr-modal-title" id="share-modal-title">分享链接</span>
        <button class="mr-close" type="button" onclick="closeShareModal()" aria-label="关闭">
          <svg class="mr-icon" aria-hidden="true"><use href="#i-close"></use></svg>
        </button>
      </div>
      <div class="mr-modal-body">
        <p>复制下方链接发送给好友，打开即可加入房间：</p>
        <input type="text" id="share-link-input" class="mr-input" readonly onclick="this.select()" />
        <div id="copy-tip" role="status"></div>
      </div>
      <div class="mr-modal-footer">
        <button class="mr-btn mr-btn-secondary" type="button" onclick="closeShareModal()">关闭</button>
        <button class="mr-btn mr-btn-primary" type="button" onclick="doCopyFromModal()">复制链接</button>
      </div>
    </div>
  </div>

  <script>
    const logicBase = window.location.protocol + '//' + window.location.hostname + ':9101';
    let uid = null;
    let adminToken = null;

    // 构造带 Authorization 的请求头
    function authHeaders() {
      const h = {'Content-Type': 'application/json'};
      if (adminToken) h['Authorization'] = 'Bearer ' + adminToken;
      return h;
    }

    async function doLogin() {
       const account = document.getElementById('acc').value;
       const password = document.getElementById('pwd').value;
       try {
          const res = await fetch(logicBase + '/api/login', {
             method:'POST', headers:{'Content-Type':'application/json'},
             body:JSON.stringify({account, password: hashPassword(password)})
          });
          const d = await res.json();
          if(d.code!==0) return document.getElementById('err-msg').textContent = d.message;
          
          uid = d.data.user_id;
          adminToken = d.data.token;
          Auth.setAdmin(uid, adminToken);

          // 切换 UI
          document.getElementById('login-card').classList.add('hidden');
          document.getElementById('dashboard').classList.remove('hidden');
          document.getElementById('user-info').classList.remove('hidden');
          document.getElementById('admin-id').textContent = uid;
          
          loadRooms();
       } catch(e){alert(e);}
    }

    function doLogout() {
      Auth.clearAdmin();
      location.reload();
    }

    // Auto Login
    (function(){
      const s = Auth.getAdmin();
      if(s) {
        uid = Number(s.user_id);
        adminToken = s.token;
        document.getElementById('login-card').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        document.getElementById('user-info').classList.remove('hidden');
        document.getElementById('admin-id').textContent = uid;
        loadRooms();
      }
    })();

    async function createRoom() {
       const name = document.getElementById('new-room-name').value;
       if(!name) return;
       const res = await fetch(logicBase+'/api/admin/chatroom/create', {
          method:'POST', headers:authHeaders(),
          body:JSON.stringify({name, owner_id:uid})
       });
       const d = await res.json();
       if(d.code===0) {
          document.getElementById('create-res').textContent = '成功: room_id=' + d.data.room_id;
          loadRooms();
       } else alert(d.message);
    }

    async function sendBroadcast() {
       const scope = document.getElementById('bc-scope').value;
       const text = document.getElementById('bc-text').value;
       const rid = parseInt(document.getElementById('bc-room-id').value) || 0;
       if(!text) return;
       
       const body = { scope, text };
       if(scope==='chatroom') body.room_id = rid;
       
       const res = await fetch(logicBase+'/api/admin/broadcast', {
          method:'POST', headers:authHeaders(), body:JSON.stringify(body)
       });
       const d = await res.json();
       if(d.code===0) alert('广播已发送');
       else alert('失败:'+d.message);
    }

    async function loadRooms() {
       const res = await fetch(logicBase+'/api/admin/chatroom/list', {
          method:'POST', headers:authHeaders(), body:JSON.stringify({limit:50})
       });
       const d = await res.json();
       const div = document.getElementById('room-list');
       div.innerHTML = '';
       if(d.code===0 && d.data.rooms) {
          d.data.rooms.forEach(r => {
             const row = document.createElement('div');
             row.className = 'admin-room-row';

             const shareLink = window.location.origin + '/chatroom.html?room_id=' + r.room_id + '&name=' + encodeURIComponent(r.name);

             row.innerHTML = `
               <div class="admin-room-main">
                 <span class="admin-room-id"></span>
                 <span class="admin-room-name"></span>
                 <span class="admin-room-owner">Owner <span class="admin-room-owner-id"></span></span>
               </div>
               <button class="mr-btn mr-btn-secondary mr-btn-sm" type="button" id="btn-${r.room_id}">分享</button>
             `;
             row.querySelector('.admin-room-id').textContent = '#' + r.room_id;
             row.querySelector('.admin-room-name').textContent = r.name;
             row.querySelector('.admin-room-owner-id').textContent = r.owner_id;
             div.appendChild(row);

             // Bind event
             document.getElementById(`btn-${r.room_id}`).onclick = () => openShareModal(shareLink);
          });
          if (!div.children.length) div.innerHTML = '<div class="admin-empty">还没有房间，先在上方创建一个。</div>';
       } else div.innerHTML = '<div class="admin-empty">暂无数据</div>';
    }

    function openShareModal(link) {
       const modal = document.getElementById('share-modal');
       const input = document.getElementById('share-link-input');
       const tip = document.getElementById('copy-tip');
       
       modal.classList.remove('hidden');
       input.value = link;
       tip.textContent = '';
       tip.classList.remove('is-error');

       input.select();
       // Try auto copy
       copyText(link, (success) => {
          if(success) tip.textContent = '已自动复制到剪贴板';
       });
    }

    function closeShareModal() {
       document.getElementById('share-modal').classList.add('hidden');
    }

    function doCopyFromModal() {
       const input = document.getElementById('share-link-input');
       copyText(input.value, (success) => {
           const tip = document.getElementById('copy-tip');
           tip.textContent = success ? '复制成功' : '复制失败，请手动复制';
           tip.classList.toggle('is-error', !success);
       });
    }

    function copyText(text, callback) {
        // 优先尝试 navigator.clipboard (需要 HTTPS 或 localhost)
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => callback(true)).catch(() => tryFallbackCopy(text, callback));
        } else {
            tryFallbackCopy(text, callback);
        }
    }

    function tryFallbackCopy(text, callback) {
        try {
            const input = document.getElementById('share-link-input');
            // 确保是选中的
            input.value = text;
            input.select(); 
            input.setSelectionRange(0, 99999); // 移动端兼容

            const successful = document.execCommand('copy');
            callback(successful);
        } catch (err) {
            callback(false);
        }
    }
  </script>
</body>
</html>
