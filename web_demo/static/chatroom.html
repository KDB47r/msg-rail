<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MsgRail · 聊天室</title>
  <meta name="description" content="MsgRail 分布式消息推送系统 · 群聊演示" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%232563eb'/%3E%3Cpath d='M5 17V8l7 4.5L19 8v9' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="ui/tokens.css" />
  <link rel="stylesheet" href="ui/base.css" />
  <link rel="stylesheet" href="ui/chat.css" />
  <script src="ui/theme.js"></script>
  <script src="ui/icons.js"></script>
  <script src="auth.js"></script>
  <script src="ui/user_profile.js"></script>
</head>
<body class="chat-app">
  <aside id="sidebar">
    <div class="sb-header">
      <a class="brand" href="chatroom.html" aria-label="MsgRail 聊天室">
        <span class="brand-mark">
          <svg class="mr-icon" aria-hidden="true"><use href="#i-logo"></use></svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">MsgRail</span>
          <span class="brand-sub">分布式消息推送系统</span>
        </span>
      </a>
      <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="切换到深色模式" title="切换到深色模式">
        <svg class="mr-icon icon-sun" aria-hidden="true"><use href="#i-sun"></use></svg>
        <svg class="mr-icon icon-moon" aria-hidden="true"><use href="#i-moon"></use></svg>
      </button>
    </div>

    <!-- 登录前 -->
    <div id="auth-box">
      <div class="auth-tabs" role="tablist" aria-label="登录或注册">
        <button type="button" class="auth-tab active" data-mode="login" role="tab" aria-selected="true">登录</button>
        <button type="button" class="auth-tab" data-mode="register" role="tab" aria-selected="false">注册</button>
      </div>
      <div class="form-group">
        <input id="account" class="form-control" placeholder="账号" autocomplete="username" />
      </div>
      <div class="form-group hidden" id="nickname-group">
        <input id="nickname" class="form-control" placeholder="昵称（注册时可选）" />
      </div>
      <div class="form-group">
        <input id="password" type="password" class="form-control" placeholder="密码" autocomplete="current-password" />
      </div>
      <button id="login-btn" class="btn-primary btn-block">立即登录</button>
      <button id="register-btn" class="btn-primary btn-block hidden">注册并自动登录</button>
      <div id="status" class="status-text" role="status"></div>

      <nav class="auth-links" aria-label="其他演示页面">
        <a class="auth-link" href="index.html">
          <svg class="mr-icon" aria-hidden="true"><use href="#i-arrow-left"></use></svg>
          <span>单聊消息中心</span>
        </a>
        <a class="auth-link" href="danmaku.html">
          <svg class="mr-icon" aria-hidden="true"><use href="#i-video"></use></svg>
          <span>视频弹幕</span>
        </a>
        <a class="auth-link" href="admin_chatroom.html">
          <svg class="mr-icon" aria-hidden="true"><use href="#i-shield"></use></svg>
          <span>管理后台</span>
        </a>
        <a class="auth-link" href="test.html">
          <svg class="mr-icon" aria-hidden="true"><use href="#i-terminal"></use></svg>
          <span>测试控制台</span>
        </a>
      </nav>
    </div>

    <!-- 登录后 -->
    <div id="room-nav" class="hidden">
      <div class="room-toolbar">
        <input id="join-room-id" class="form-control" placeholder="房间 ID，例如 1001" />
        <button id="join-btn" class="btn-primary" type="button">加入</button>
      </div>
      <nav class="side-nav-links" aria-label="功能入口">
        <a class="side-nav-link" href="index.html">
          <svg class="mr-icon" aria-hidden="true"><use href="#i-arrow-left"></use></svg>
          <span>单聊消息</span>
        </a>
        <a class="side-nav-link" href="contacts.html">
          <svg class="mr-icon" aria-hidden="true"><use href="#i-users"></use></svg>
          <span>联系人</span>
        </a>
        <a class="side-nav-link" href="profile.html">
          <svg class="mr-icon" aria-hidden="true"><use href="#i-spark"></use></svg>
          <span>我的资料</span>
        </a>
      </nav>
      <div class="room-section-label">
        <span>我的订阅</span>
        <span class="section-actions">
          <span id="global-unread" class="unread-badge hidden">0</span>
          <button id="refresh-rooms-btn" type="button">刷新</button>
        </span>
      </div>
      <div id="room-list" class="room-list"></div>
      <div class="room-footer">
        <a class="mr-row profile-link" href="profile.html" title="编辑我的资料">
          <div id="my-avatar" class="avatar-placeholder">Me</div>
          <span id="my-id" class="room-user"></span>
        </a>
        <a href="#" class="logout-btn" onclick="doLogout(); return false;">退出</a>
      </div>
    </div>
  </aside>

  <main id="main">
    <div id="header-bar">
      <div class="chat-title-group">
        <span id="room-title">未选择房间</span>
        <span class="chat-sub">群聊 / 直播间模式</span>
      </div>
      <span id="online-count">在线</span>
    </div>
    <div id="msgs">
      <div class="empty-hint">
        <svg class="mr-icon" aria-hidden="true"><use href="#i-users"></use></svg>
        <strong>选择一个房间开始聊天</strong>
        <span>在左侧加入或选择房间，消息会实时抵达。</span>
      </div>
    </div>
    <div id="input-box">
      <input id="msg-input" class="form-control" placeholder="输入消息，Enter 发送" />
      <button id="send-btn" class="btn-primary" type="button">
        <svg class="mr-icon" aria-hidden="true"><use href="#i-send"></use></svg>
        <span>发送</span>
      </button>
    </div>
  </main>

  <script>
    const logicBase = window.location.protocol + '//' + window.location.hostname + ':9101';
    const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const cometWsUrl = wsProtocol + '//' + window.location.hostname + ':9200/ws';
    
    let ws=null, uid=null, token=null, myName=null, currentRoom=null, currentRoomName='';
    let wsReconnectTimer=null;
    let shouldReconnect=true;
    let myProfile=null;

    // 构造带 Authorization 的请求头
    function authHeaders() {
      const h = {'Content-Type': 'application/json'};
      if (token) h['Authorization'] = 'Bearer ' + token;
      return h;
    }

    async function apiPost(path, payload) {
      const res = await authenticatedFetch(logicBase + path, {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify(payload || {})
      });
      if (!res) return null;
      let body = {};
      try { body = await res.json(); } catch (e) { body = {}; }
      if (!res.ok || body.code !== 0) {
        const err = new Error(body.message || ('HTTP ' + res.status));
        err.status = res.status;
        throw err;
      }
      return body.data || {};
    }

    function setBadge(el, count) {
      if (!el) return;
      const n = Math.max(0, Number(count) || 0);
      el.textContent = n > 99 ? '99+' : String(n);
      el.classList.toggle('hidden', n <= 0);
    }

    async function refreshGlobalUnread() {
      if (!uid || !token) return;
      try {
        const data = await apiPost('/api/session/unread_summary', {});
        if (data) {
          setBadge(document.getElementById('global-unread'), data.total);
        }
      } catch (e) {
        console.warn('load unread summary failed', e);
      }
    }

    async function loadSelfProfile() {
      if (!uid || !token) return;
      try {
        const profile = await apiPost('/api/user/profile', {});
        if (!profile) return;
        myProfile = profile;
        myName = profile.name || myName;
        UserProfile.prime(profile);
        UserProfile.applyAvatar(
          document.getElementById('my-avatar'), profile, uid);
        document.getElementById('my-id').textContent =
          (myName || ('User ' + uid)) + ' · ' + uid;
        Auth.set(uid, token, myName || ('User ' + uid));
      } catch (e) {
        console.warn('load self profile failed', e);
      }
    }

    function handleTokenExpired() {
       if (!token && !uid) return;
       Auth.clear();
       shouldReconnect = false;
       clearTimeout(wsReconnectTimer);
       if (ws) {
          const socket = ws;
          ws = null;
          socket.onclose = null;
          socket.close();
       }
       uid = null;
       token = null;
       myName = null;
       myProfile = null;
       currentRoom = null;
       currentRoomName = '';
       currentSessionId = null;
       setBadge(document.getElementById('global-unread'), 0);
       document.getElementById('room-title').textContent = '未选择房间';
       document.getElementById('msgs').innerHTML = '<div class="empty-hint"><strong>登录状态已失效</strong><span>请重新登录后继续聊天。</span></div>';
       document.getElementById('status').textContent = '登录状态已失效，请重新登录';
       toggleUI(false);
    }

    async function authenticatedFetch(url, options) {
       const res = await fetch(url, options);
       if (res.status === 401) {
          handleTokenExpired();
          return null;
       }
       return res;
    }
    // 对应当前房间在后端的 session_id，用于拉取历史消息
    let currentSessionId=null;
    // 聊天室历史分页状态
    let roomHistoryAnchorSeq = 0;   // 当前已加载历史中最早一条的 msg_seq
    let roomHistoryHasMore = true;  // 是否还有更多历史
    let roomHistoryLoading = false; // 是否正在加载
    
    // UI Toggles
    function toggleUI(isLogin) {
       const ab = document.getElementById('auth-box');
       const rn = document.getElementById('room-nav');
       if(isLogin) {
          ab.classList.add('hidden');
          rn.classList.remove('hidden');
          document.getElementById('my-id').textContent =
            (myName || ('User ' + uid)) + ' · ' + uid;
          if (myProfile) {
            UserProfile.applyAvatar(
              document.getElementById('my-avatar'), myProfile, uid);
          } else {
            UserProfile.applyAvatar(
              document.getElementById('my-avatar'), null, uid);
          }

          // 如果有 URL 参数 room_id，自动加入
          const params = new URLSearchParams(window.location.search);
          const rid = params.get('room_id');
          if(rid && !currentRoom) {
             // 稍作延迟确保 WS 连接
             setTimeout(() => {
                 document.getElementById('join-room-id').value = rid;
                 joinRoom();
             }, 500);
          }

          loadMyRooms();
          loadSelfProfile();
          refreshGlobalUnread();
       } else {
          ab.classList.remove('hidden');
          rn.classList.add('hidden');
       }
    }

    // Tab switching logic
    document.querySelectorAll('.auth-tab').forEach(btn => {
       btn.onclick = () => {
         document.querySelectorAll('.auth-tab').forEach(b => b.classList.remove('active'));
         btn.classList.add('active');
         const mode = btn.dataset.mode;
         const regBtn = document.getElementById('register-btn');
         const logBtn = document.getElementById('login-btn');
         const nickGroup = document.getElementById('nickname-group');
         
         if(mode === 'login') {
            regBtn.classList.add('hidden');
            logBtn.classList.remove('hidden');
            nickGroup.classList.add('hidden');
         } else {
            regBtn.classList.remove('hidden');
            logBtn.classList.add('hidden');
            nickGroup.classList.remove('hidden');
         }
         document.getElementById('status').textContent = '';
       };
    });

    async function doLoginOrRegister(mode) {
       const account = document.getElementById('account').value.trim();
       const pass = document.getElementById('password').value;
       const nickname = document.getElementById('nickname').value.trim();
       
       if(!account || !pass) return document.getElementById('status').textContent = '请输入账号密码';
       
       try {
         const url = logicBase + (mode === 'register' ? '/api/register' : '/api/login');
         const body = {account, password: hashPassword(pass)};
         if(mode === 'register') body.name = nickname;

         const res = await fetch(url, {
            method:'POST', headers:{'Content-Type':'application/json'},
            body:JSON.stringify(body)
         });
         const d = await res.json();
         if(d.code!==0) return document.getElementById('status').textContent=d.message;
         
         // Success
         uid = d.data.user_id; token = d.data.token; myName = d.data.name;
         Auth.set(uid, token, myName);
         document.getElementById('status').textContent = '';
         shouldReconnect = true;
         toggleUI(true);
         connectWs();
       } catch(e){ document.getElementById('status').textContent = 'Error: '+e; }
    }

    function joinCurrentRoomOverWs() {
       if (currentRoom && ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({type:'chatroom_join', group_id:Number(currentRoom)}));
       }
    }

    function connectWs() {
       if (!token) return;
       if(ws) ws.close();
       const socket = new WebSocket(cometWsUrl + '?token=' + encodeURIComponent(token));
       let opened = false;
       ws = socket;
       socket.onopen = () => {
          if (socket !== ws) return;
          opened = true;
          console.log('WS OK');
          joinCurrentRoomOverWs();
       };
       socket.onmessage = (e) => {
          try {
             const msg = JSON.parse(e.data);
             console.info('msg', msg);
             if(msg.type === 'chatroom') {
                // 消息格式化
                // msg.content 可能是字符串或者对象
                let contentObj = msg.content;
                if(typeof contentObj === 'string') {
                   try { contentObj = JSON.parse(contentObj); } catch(x){}
                }
                
                let text = contentObj.text;
                // 兼容嵌套结构 (如 WebSocket 上行消息存库后被包裹了一层)
                if (!text && contentObj.content) {
                    const inner = contentObj.content;
                    if (typeof inner === 'string') text = inner;
                    else if (inner.text) text = inner.text;
                }
                if (!text) text = JSON.stringify(contentObj);

                const senderId = Number(msg.from_user_id ||
                                        contentObj.from_user_id || 0);
                const sender = msg.sender || contentObj.sender || null;
                const senderName = (sender && sender.name) ||
                                   (senderId ? ('User ' + senderId) : '有人');

                // 只有当前选中的房间才显示 (简单Demo逻辑)
                if(msg.group_id === currentRoom) {
                   const isMe = (senderId === Number(uid));
                   const timeStr = new Date(msg.create_time || msg.timestamp_ms ||
                                            Date.now()).toLocaleTimeString();
                   appendMsg(text, isMe, senderName, false, timeStr,
                             { senderId, sender });
                   if (!isMe) markRoomMessageRead(msg.msg_id, msg.msg_seq);
                } else {
                   // 其他房间收到消息：刷新未读角标。
                   loadMyRooms();
                   refreshGlobalUnread();
                }
             } else if (msg.type === 'system_broadcast') {
                // 处理系统广播（房间广播已由服务端 PushToRoom；此处按 group_id 过滤仅为展示兜底）
                let text = '';
                if (typeof msg.content === 'string') text = msg.content;
                else if (msg.content && msg.content.text) text = msg.content.text;
                else text = JSON.stringify(msg.content);
                
                // 全站，或房间广播且当前就在该房间
                if (msg.scope === 'all' || (msg.room_id && msg.room_id === currentRoom) || (msg.group_id && msg.group_id === currentRoom)) {
                     appendMsg(text, false, '系统广播', true);
                } else if (!msg.room_id && !msg.group_id) {
                     // 没有指定房间的广播，通常是全局
                     appendMsg(text, false, '系统广播', true);
                }
             }
          } catch(x){}
       };
       socket.onclose = () => {
          if (socket !== ws) return;
          ws = null;
          if (!shouldReconnect || !token) return;
          if (!opened) {
             verifyTokenAfterHandshakeFailure();
             return;
          }
          clearTimeout(wsReconnectTimer);
          wsReconnectTimer = setTimeout(connectWs, 1000);
       };
    }

    async function verifyTokenAfterHandshakeFailure() {
       if (!token) return;
       const tokenAtFailure = token;
       try {
          const res = await fetch(logicBase + '/api/chatroom/list', {
             method:'POST', headers:authHeaders(), body:JSON.stringify({})
          });
          if (token !== tokenAtFailure) return;
          if (res.status === 401) {
             handleTokenExpired();
             return;
          }
       } catch (e) {
          console.warn('Token verification unavailable after WS failure:', e);
       }
       if (token === tokenAtFailure && shouldReconnect) {
          clearTimeout(wsReconnectTimer);
          wsReconnectTimer = setTimeout(connectWs, 1000);
       }
    }

    async function loadMyRooms() {
       try {
          const res = await authenticatedFetch(logicBase+'/api/chatroom/list', {
             method:'POST',
             headers:authHeaders(),
             body:JSON.stringify({})
          });
          if (!res) return;
          const d = await res.json();
          const listDiv = document.getElementById('room-list');
          listDiv.innerHTML = '';
          if(d.code===0 && d.data.rooms) {
             d.data.rooms.forEach(r => {
                const div = document.createElement('div');
                div.className = 'room-item';
                if(r.room_id === currentRoom) div.classList.add('active');
                div.dataset.rid = r.room_id;
                div.dataset.name = r.name;
                // 记录后端的会话 ID，后面拉取历史消息会用到
                if (r.session_id) {
                  div.dataset.sessionId = r.session_id;
                }
                div.innerHTML =
                  '<span class="room-name"></span>' +
                  '<span class="room-meta">' +
                    '<span class="room-id"></span>' +
                    '<span class="unread-badge hidden">0</span>' +
                  '</span>';
                div.querySelector('.room-name').textContent = r.name;
                div.querySelector('.room-id').textContent = '#' + r.room_id;
                setBadge(div.querySelector('.unread-badge'), r.unread);
                div.onclick = () => selectRoom(r.room_id, r.name, div);
                listDiv.appendChild(div);
             });
          }
          if (!listDiv.children.length) {
             listDiv.innerHTML = '<div class="session-empty">还没有订阅房间<br>输入房间 ID 加入</div>';
          }
          refreshGlobalUnread();
       } catch(e){
          console.error('loadMyRooms error', e);
       }
    }
    
    async function joinRoom() {
       const rid = parseInt(document.getElementById('join-room-id').value);
       if(!rid || !token) return;
       const res = await authenticatedFetch(logicBase+'/api/chatroom/join', {
          method:'POST', headers:authHeaders(), body:JSON.stringify({room_id:rid})
       });
       if (!res) return;
       const d = await res.json();
       if (d.code !== 0) {
          document.getElementById('status').textContent = d.message || '加入房间失败';
          return;
       }
       if(ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({type:'chatroom_join', group_id:rid}));
       }
       
       await loadMyRooms(); // 刷新列表并等待完成
       
       // 自动选中新加入的房间
       const items = document.querySelectorAll('.room-item');
       for(let i=0; i<items.length; i++) {
          if(parseInt(items[i].dataset.rid) === rid) {
             selectRoom(rid, items[i].dataset.name, items[i]);
             break;
          }
       }
    }
    
    function selectRoom(rid, rname, el) {
       currentRoom = rid;
       currentRoomName = rname || ('房间 '+rid);
       document.getElementById('room-title').textContent = currentRoomName;
       document.getElementById('msgs').innerHTML = ''; // 清空旧消息

       // 重置历史分页状态
       roomHistoryAnchorSeq = 0;
       roomHistoryHasMore = true;
       roomHistoryLoading = false;

       // 取出该房间对应的 session_id（如果有）
       let sid = null;
       if (el && el.dataset && el.dataset.sessionId) {
          sid = el.dataset.sessionId;
       } else {
          const item = document.querySelector(`.room-item[data-rid="${rid}"]`);
          if (item && item.dataset && item.dataset.sessionId) {
            sid = item.dataset.sessionId;
          }
       }
       currentSessionId = sid || (`room:${rid}`);
       joinCurrentRoomOverWs();
       
       document.querySelectorAll('.room-item').forEach(x=>x.classList.remove('active'));
       if(el) el.classList.add('active');
       else {
          // 尝试通过ID查找
           const item = document.querySelector(`.room-item[data-rid="${rid}"]`);
           if(item) item.classList.add('active');
       }
       
       const selectedRoom = rid;
       // 先加载历史，再追加“已进入”提示，避免把系统提示插在历史中间
       loadHistory(true).then(() => {
         if (token && currentRoom === selectedRoom) {
           appendMsg(`已进入 ${currentRoomName}`, true, '系统', true);
         }
       }).catch(() => {
         if (token && currentRoom === selectedRoom) {
           appendMsg(`已进入 ${currentRoomName}`, true, '系统', true);
         }
       }).finally(() => {
         if (token && currentRoom === selectedRoom) {
           markCurrentRoomRead();
         }
       });
    }

    function seqFromMsgId(msgId) {
       if (!msgId) return 0;
       const idx = String(msgId).lastIndexOf('-');
       if (idx < 0) return 0;
       const n = Number(String(msgId).slice(idx + 1));
       return Number.isFinite(n) ? n : 0;
    }

    // 正在看的房间收到消息时，直接推进读游标，不额外查一次 unread。
    async function markRoomMessageRead(msgId, msgSeq) {
       if (!currentSessionId || !token) return;
       const sid = currentSessionId;
       const seq = Number(msgSeq) || seqFromMsgId(msgId);
       if (!seq) return;
       try {
          await apiPost('/api/session/mark_read',
                        { session_id: sid, read_seq: seq });
          if (currentSessionId === sid) {
             const item = document.querySelector(
               '.room-item[data-rid="' + currentRoom + '"]');
             if (item) setBadge(item.querySelector('.unread-badge'), 0);
          }
          refreshGlobalUnread();
       } catch (e) {
          console.warn('mark room message read failed', e);
       }
    }

    // 打开房间时把该会话全部标记已读。
    async function markCurrentRoomRead() {
       if (!currentSessionId || !token) return;
       const sid = currentSessionId;
       try {
          const data = await apiPost('/api/session/unread',
                                     { session_id: sid });
          if (!data) return;
          const seq = Number(data.last_msg_seq) || 0;
          if (seq > 0) {
             await apiPost('/api/session/mark_read',
                           { session_id: sid, read_seq: seq });
          }
          if (currentSessionId === sid) {
             const item = document.querySelector(
               '.room-item[data-rid="' + currentRoom + '"]');
             if (item) setBadge(item.querySelector('.unread-badge'), 0);
             loadMyRooms();
             refreshGlobalUnread();
          }
       } catch (e) {
          console.warn('mark room read failed', e);
       }
    }

    // 拉取当前聊天室的历史消息（分页）
    async function loadHistory(isInitial) {
       if (!currentSessionId) return;
       if (roomHistoryLoading) return;

       // 非首次加载且没有更多历史时，直接返回
       if (!isInitial && (!roomHistoryHasMore || !roomHistoryAnchorSeq)) return;

       roomHistoryLoading = true;
       const pageSize = 50;
       const anchor = isInitial ? 0 : roomHistoryAnchorSeq;

       try {
         const res = await authenticatedFetch(logicBase + '/api/session/history', {
            method:'POST',
            headers:authHeaders(),
            body: JSON.stringify({
              session_id: currentSessionId,
              anchor_seq: anchor,
              limit: pageSize
            })
         });
         if (!res) return;
         const d = await res.json();
         if (d.code !== 0 || !d.data || !Array.isArray(d.data.messages)) {
           roomHistoryLoading = false;
           return;
         }

         const msgs = d.data.messages;
         if (msgs.length === 0) {
           roomHistoryHasMore = false;
           roomHistoryLoading = false;
           return;
         }

         const container = document.getElementById('msgs');
         const oldScrollHeight = container.scrollHeight;

         const orderedMsgs = isInitial ? msgs : [...msgs].reverse();
         orderedMsgs.forEach(m => {
            let contentObj = m.content;
            if (typeof contentObj === 'string') {
              try { contentObj = JSON.parse(contentObj); } catch(_) {}
            }
            if (!contentObj) return;

            // 只展示聊天室类型的消息
            if (contentObj.type && contentObj.type !== 'chatroom') return;

            // 解析正文
            let text = '';
            if (contentObj.content) {
              const inner = contentObj.content;
              if (typeof inner === 'string') text = inner;
              else if (inner && inner.text) text = inner.text;
            }
            if (!text) {
              // 兼容 text 直接挂在顶层的老格式
              if (contentObj.text) text = contentObj.text;
            }
            if (!text) {
              text = JSON.stringify(contentObj);
            }

            // 发送者：优先使用后端批量补全的 sender 对象。
            const sender = m.sender || contentObj.sender || null;
            const senderId = Number(m.sender_id || 0);
            const senderName = (sender && sender.name) ||
                               (senderId ? ('User ' + senderId) : '有人');

            const isMe = (senderId === Number(uid));
            const timeStr = new Date(m.timestamp_ms || Date.now()).toLocaleTimeString();

            // 首次加载：直接追加；后续分页：插入顶部并保持滚动位置
            if (isInitial) {
              appendMsg(text, isMe, senderName, false, timeStr,
                        { senderId, sender });
            } else {
              appendMsg(text, isMe, senderName, false, timeStr,
                        { prepend: true, keepScroll: true, senderId, sender });
            }
         });

         // 更新 anchor_seq：使用本次批次中最早一条的 msg_seq
         const first = msgs[0];
         if (first && typeof first.msg_seq === 'number') {
           if (!roomHistoryAnchorSeq || first.msg_seq < roomHistoryAnchorSeq) {
             roomHistoryAnchorSeq = first.msg_seq;
           }
         }
         roomHistoryHasMore = msgs.length >= pageSize && roomHistoryAnchorSeq > 1;

         if (!isInitial) {
           const newScrollHeight = container.scrollHeight;
           container.scrollTop = newScrollHeight - oldScrollHeight;
         }
       } catch (e) {
         console.error('loadHistory error', e);
       } finally {
         roomHistoryLoading = false;
       }
    }
    
    // 统一的消息追加函数，支持 prepend / 保持滚动
    function appendMsg(text, isMe, name, isSys, timeStr, options) {
       const div = document.getElementById('msgs');
       const opts = options || {};
       const prepend = !!opts.prepend;
       const keepScroll = !!opts.keepScroll;

       let node;
       if (isSys) {
          node = document.createElement('div');
          node.className = 'msg sys';
          node.textContent = text;
       } else {
          const senderId = Number(opts.senderId) ||
                           (isMe ? Number(uid) : 0);
          const senderProfile = opts.sender || (isMe ? myProfile : null);
          if (senderProfile && senderProfile.user_id) {
             UserProfile.prime(senderProfile);
          }
          const fallbackName = name ||
            (senderProfile && senderProfile.name) ||
            (isMe ? (myName || '我')
                  : (senderId ? ('User ' + senderId) : '有人'));

          const row = document.createElement('div');
          row.className = 'room-msg-row ' + (isMe ? 'me' : 'other');

          const avatar = document.createElement('div');
          avatar.className = 'msg-avatar room-msg-avatar';
          UserProfile.applyAvatar(avatar, senderProfile, senderId);

          node = document.createElement('div');
          node.className = 'msg ' + (isMe ? 'me' : 'other');

          const sender = document.createElement('div');
          sender.className = 'sender-name';
          const nameSpan = document.createElement('span');
          nameSpan.textContent =
            (senderProfile && senderProfile.name) || fallbackName;
          const time = document.createElement('span');
          time.className = 'msg-time';
          time.textContent = timeStr || '';
          sender.appendChild(nameSpan);
          sender.appendChild(time);

          const content = document.createElement('div');
          content.textContent = text;
          node.appendChild(sender);
          node.appendChild(content);

          if (!senderProfile && senderId) {
             UserProfile.hydrate(avatar, senderId, nameSpan, fallbackName);
          }
          row.appendChild(avatar);
          row.appendChild(node);
          node = row;
       }

       if (prepend && div.firstChild) {
         div.insertBefore(node, div.firstChild);
       } else {
         div.appendChild(node);
       }

       if (!prepend && !keepScroll) {
         div.scrollTop = div.scrollHeight;
       }
    }
    
    document.getElementById('login-btn').onclick = () => doLoginOrRegister('login');
    document.getElementById('register-btn').onclick = () => doLoginOrRegister('register');
    document.getElementById('password').onkeydown = (e) => {
       if(e.key === 'Enter') {
          const isReg = !document.getElementById('register-btn').classList.contains('hidden');
          doLoginOrRegister(isReg ? 'register' : 'login');
       }
    };
    document.getElementById('join-btn').onclick = joinRoom;
    document.getElementById('refresh-rooms-btn').onclick = () => {
       loadMyRooms();
       refreshGlobalUnread();
    };

    // 未读角标轮询：30 秒刷新一次房间列表与总未读。
    setInterval(() => {
       if (token && uid) {
          loadMyRooms();
          refreshGlobalUnread();
       }
    }, 30000);

    // 上滑到顶部时自动加载更多历史
    document.getElementById('msgs').addEventListener('scroll', function() {
       if (this.scrollTop < 40 && !roomHistoryLoading && roomHistoryHasMore && currentSessionId) {
          loadHistory(false);
       }
    });
    
    // Enter to send
    document.getElementById('msg-input').onkeydown = (e) => {
       if(e.key === 'Enter') document.getElementById('send-btn').click();
    };
    
    document.getElementById('send-btn').onclick = () => {
       const txt = document.getElementById('msg-input').value;
       if(!txt || !currentRoom) return;
       if(ws) ws.send(JSON.stringify({
          type:'chatroom', group_id:currentRoom, content:{text:txt}, client_msg_id:Date.now()+''
       }));
       // 乐观更新
       // appendMsg(txt, true, myName || '我'); 
       // 注：如果依赖后端回推 inject sender info，这里最好不乐观更新，或者乐观更新时只有 text
       document.getElementById('msg-input').value = '';
    };

    function doLogout() {
      Auth.clear();
      shouldReconnect = false;
      clearTimeout(wsReconnectTimer);
      if(ws) ws.close();
      uid = null;
      token = null;
      toggleUI(false);
    }

    // Auto Login initialization
    (function() {
      const s = Auth.get();
      if (s) {
        uid = Number(s.user_id);
        token = s.token;
        myName = s.name;
        shouldReconnect = true;
        toggleUI(true);
        connectWs();
      }
    })();
  </script>
