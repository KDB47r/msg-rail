<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>联系人 · MsgRail</title>
  <meta name="description" content="MsgRail 联系人：好友列表与好友申请" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%232563eb'/%3E%3Cpath d='M5 17V8l7 4.5L19 8v9' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="ui/tokens.css" />
  <link rel="stylesheet" href="ui/base.css" />
  <link rel="stylesheet" href="ui/chat.css" />
  <style>
    .page-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--mr-bg);
      background-image:
        radial-gradient(60% 45% at 100% 0%, var(--mr-aurora-1), transparent 70%),
        radial-gradient(50% 40% at 0% 100%, var(--mr-aurora-2), transparent 70%);
    }
    .page-header {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--mr-border);
      background: var(--mr-glass);
      -webkit-backdrop-filter: blur(18px) saturate(1.15);
      backdrop-filter: blur(18px) saturate(1.15);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .page-nav {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
      min-width: 0;
    }
    .page-nav a {
      padding: 7px 12px;
      border-radius: 9px;
      color: var(--mr-text-2);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
    }
    .page-nav a:hover { background: var(--mr-surface-2); color: var(--mr-text); }
    .page-nav a.active { background: var(--mr-accent-soft); color: var(--mr-accent); }
    .page-user {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      color: var(--mr-text);
      font-size: 13px;
      font-weight: 550;
    }
    .page-user .avatar-placeholder { width: 32px; height: 32px; flex-basis: 32px; }
    .contacts-main {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 24px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
      gap: 20px;
      align-items: start;
    }
    .right-col { display: flex; flex-direction: column; gap: 20px; }
    .panel {
      border: 1px solid var(--mr-border);
      border-radius: 16px;
      background: var(--mr-surface);
      box-shadow: var(--mr-shadow-sm);
      overflow: hidden;
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px 10px;
    }
    .panel h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 650;
      color: var(--mr-text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel h3 {
      margin: 12px 18px 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--mr-text-3);
      letter-spacing: 0.04em;
    }
    .panel .hint {
      margin: 0;
      padding: 0 18px 10px;
      font-size: 12px;
      line-height: 1.6;
      color: var(--mr-text-3);
    }
    .panel-body { padding: 6px 12px 14px; }
    .card-list { display: flex; flex-direction: column; gap: 4px; }
    .user-card {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid transparent;
      transition: background-color var(--mr-fast) var(--mr-ease),
        border-color var(--mr-fast) var(--mr-ease);
    }
    .user-card:hover { background: var(--mr-surface-2); border-color: var(--mr-border); }
    .user-card .user-main { flex: 1; min-width: 0; }
    .user-card .user-name {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--mr-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .user-card .user-sub {
      font-size: 11.5px;
      color: var(--mr-text-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .user-card .user-actions { display: flex; gap: 6px; flex: 0 0 auto; }
    .mini-btn {
      height: 30px;
      padding: 0 11px;
      border: 1px solid var(--mr-border);
      border-radius: 9px;
      background: var(--mr-surface);
      color: var(--mr-text-2);
      font-family: var(--mr-font);
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .mini-btn:hover { border-color: var(--mr-border-strong); color: var(--mr-text); }
    .mini-btn.primary {
      border-color: transparent;
      background-image: var(--mr-gradient);
      background-color: var(--mr-accent-solid);
      color: #fff;
    }
    .mini-btn.danger { color: var(--mr-danger); }
    .mini-btn:disabled { opacity: 0.55; cursor: default; }
    .search-row {
      display: flex;
      gap: 8px;
      padding: 0 18px 10px;
    }
    .search-row .form-control { flex: 1; height: 38px; }
    .search-row .btn-primary { height: 38px; padding: 0 16px; flex: 0 0 auto; }
    .empty-line {
      padding: 14px 10px;
      font-size: 12.5px;
      color: var(--mr-text-3);
      text-align: center;
    }
    .relationship-tag {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 8px;
      border-radius: var(--mr-r-pill);
      background: var(--mr-surface-2);
      color: var(--mr-text-3);
      font-size: 11px;
    }
    .request-card { flex-wrap: wrap; }
    .request-message {
      flex-basis: 100%;
      margin: 2px 0 0 49px;
      font-size: 12px;
      color: var(--mr-text-2);
      line-height: 1.5;
    }
    @media (max-width: 860px) {
      .contacts-main { grid-template-columns: minmax(0, 1fr); padding: 14px; }
      .page-header { padding: 12px 14px; gap: 10px; flex-wrap: wrap; }
      .page-nav { order: 3; flex-basis: 100%; overflow-x: auto; }
      .page-user { margin-left: auto; }
      .brand-sub { display: none; }
    }
  </style>
  <script src="ui/theme.js"></script>
  <script src="ui/icons.js"></script>
  <script src="auth.js"></script>
  <script src="ui/user_profile.js"></script>
</head>
<body class="page-shell">
  <div id="toast-container" role="status" aria-live="polite"></div>

  <header class="page-header">
    <a class="brand" href="index.html" aria-label="MsgRail 消息中心">
      <span class="brand-mark">
        <svg class="mr-icon" aria-hidden="true"><use href="#i-logo"></use></svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">MsgRail</span>
        <span class="brand-sub">联系人</span>
      </span>
    </a>
    <nav class="page-nav" aria-label="页面导航">
      <a href="index.html">消息</a>
      <a class="active" href="contacts.html">联系人</a>
      <a href="chatroom.html">聊天室</a>
      <a href="profile.html">我的资料</a>
    </nav>
    <div class="page-user">
      <div id="nav-avatar" class="avatar-placeholder">Me</div>
      <span id="nav-name">User</span>
    </div>
  </header>

  <main class="contacts-main">
    <section class="panel">
      <div class="panel-head">
        <h2>我的好友 <span id="friend-count" class="relationship-tag">0</span></h2>
        <button id="refresh-friends-btn" class="mini-btn" type="button">刷新</button>
      </div>
      <div class="panel-body">
        <div id="friend-list" class="card-list">
          <div class="empty-line">加载中...</div>
        </div>
      </div>
    </section>

    <div class="right-col">
      <section class="panel">
        <div class="panel-head">
          <h2>添加好友</h2>
        </div>
        <p class="hint">
          输入完整 UserID（精确匹配）或昵称（精确匹配，可能重名）。
          昵称相同也以 UserID 作为唯一身份。
        </p>
        <form id="search-form" class="search-row">
          <input id="search-input" class="form-control" autocomplete="off"
                 placeholder="UserID 或完整昵称" />
          <button class="btn-primary" type="submit">搜索</button>
        </form>
        <div id="search-status" class="status-text"></div>
        <div class="panel-body">
          <div id="search-results" class="card-list"></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>好友申请
            <span id="pending-badge" class="unread-badge hidden">0</span>
          </h2>
          <button id="refresh-requests-btn" class="mini-btn" type="button">刷新</button>
        </div>
        <div class="panel-body">
          <div id="incoming-list" class="card-list">
            <div class="empty-line">加载中...</div>
          </div>
          <h3>我发出的</h3>
          <div id="outgoing-list" class="card-list"></div>
        </div>
      </section>
    </div>
  </main>

  <script>
    (function () {
      'use strict';

      const saved = window.Auth && Auth.get();
      if (!saved || !saved.token) {
        window.location.replace('index.html');
        return;
      }
      const token = saved.token;
      const myUserId = Number(saved.user_id);
      const logicBase = window.location.protocol + '//' +
                        window.location.hostname + ':9101';
      let pollTimer = null;
      let lastSearchKeyword = '';

      function authHeaders() {
        return {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token
        };
      }

      async function apiPost(path, payload) {
        const resp = await fetch(logicBase + path, {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify(payload || {})
        });
        let body = {};
        try { body = await resp.json(); } catch (e) { body = {}; }
        if (!resp.ok || body.code !== 0) {
          const err = new Error(body.message || ('HTTP ' + resp.status));
          err.status = resp.status;
          throw err;
        }
        return body.data || {};
      }

      function showToast(msg) {
        const container = document.getElementById('toast-container');
        const div = document.createElement('div');
        div.className = 'toast';
        div.textContent = msg;
        container.appendChild(div);
        setTimeout(() => {
          div.style.animation = 'toast-out 0.3s ease-in forwards';
          div.addEventListener('animationend', () => {
            if (div.parentNode) div.parentNode.removeChild(div);
          });
        }, 3000);
      }

      function setBadge(el, count) {
        const n = Math.max(0, Number(count) || 0);
        el.textContent = n > 99 ? '99+' : String(n);
        el.classList.toggle('hidden', n <= 0);
      }

      function userProfile(user) {
        return {
          user_id: user.user_id,
          name: user.name || '',
          avatar_media_id: user.avatar_media_id || '',
          avatar_url: user.avatar_url || '',
          avatar_expires_at: user.avatar_expires_at || 0
        };
      }

      function avatarEl(user) {
        const profile = userProfile(user);
        if (profile.name || profile.avatar_url || profile.avatar_media_id) {
          UserProfile.prime(profile);
        }
        const el = document.createElement('div');
        el.className = 'avatar-placeholder';
        UserProfile.applyAvatar(el, profile, user.user_id);
        return el;
      }

      function userCard(user, actions) {
        const card = document.createElement('div');
        card.className = 'user-card';
        card.appendChild(avatarEl(user));

        const main = document.createElement('div');
        main.className = 'user-main';
        const name = document.createElement('div');
        name.className = 'user-name';
        name.textContent = user.name || ('User ' + user.user_id);
        const sub = document.createElement('div');
        sub.className = 'user-sub';
        sub.textContent = 'UserID ' + user.user_id;
        main.appendChild(name);
        main.appendChild(sub);
        card.appendChild(main);

        const actionWrap = document.createElement('div');
        actionWrap.className = 'user-actions';
        (actions || []).forEach(action => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'mini-btn' +
            (action.primary ? ' primary' : '') +
            (action.danger ? ' danger' : '');
          btn.textContent = action.label;
          if (action.disabled) btn.disabled = true;
          btn.onclick = action.onClick;
          actionWrap.appendChild(btn);
        });
        card.appendChild(actionWrap);
        return card;
      }

      async function loadSelf() {
        try {
          const profile = await apiPost('/api/user/profile', {});
          UserProfile.prime(profile);
          document.getElementById('nav-name').textContent =
            profile.name || ('User ' + myUserId);
          UserProfile.applyAvatar(
            document.getElementById('nav-avatar'), profile, myUserId);
          Auth.set(myUserId, token, profile.name || ('User ' + myUserId));
        } catch (e) {
          console.warn('load self profile failed', e);
        }
      }

      async function loadFriends() {
        const list = document.getElementById('friend-list');
        try {
          const data = await apiPost('/api/friend/list', {});
          const friends = data.friends || [];
          document.getElementById('friend-count').textContent =
            String(friends.length);
          list.innerHTML = '';
          if (!friends.length) {
            list.innerHTML =
              '<div class="empty-line">还没有好友，先搜索并添加一个吧。</div>';
            return;
          }
          friends.forEach(friend => {
            list.appendChild(userCard(friend, [{
              label: '发消息',
              primary: true,
              onClick: () => openChat(friend.user_id)
            }]));
          });
        } catch (e) {
          list.innerHTML = '<div class="empty-line">好友列表加载失败</div>';
          showToast('好友列表加载失败: ' + e.message);
        }
      }

      async function loadRequests() {
        const incomingList = document.getElementById('incoming-list');
        const outgoingList = document.getElementById('outgoing-list');
        try {
          const data = await apiPost('/api/friend/requests', {});
          const incoming = data.incoming || [];
          const outgoing = data.outgoing || [];

          incomingList.innerHTML = '';
          if (!incoming.length) {
            incomingList.innerHTML =
              '<div class="empty-line">没有待处理的好友申请。</div>';
          } else {
            incoming.forEach(req => {
              const card = userCard(req.from_user, [
                {
                  label: '同意', primary: true,
                  onClick: () => respond(req.request_id, 'accept')
                },
                {
                  label: '拒绝', danger: true,
                  onClick: () => respond(req.request_id, 'reject')
                }
              ]);
              card.classList.add('request-card');
              if (req.message) {
                const msg = document.createElement('div');
                msg.className = 'request-message';
                msg.textContent = '留言：' + req.message;
                card.appendChild(msg);
              }
              incomingList.appendChild(card);
            });
          }

          outgoingList.innerHTML = '';
          if (!outgoing.length) {
            outgoingList.innerHTML =
              '<div class="empty-line">暂无已发出的申请。</div>';
          } else {
            outgoing.forEach(req => {
              outgoingList.appendChild(userCard(req.to_user, [{
                label: '等待对方同意',
                disabled: true
              }]));
            });
          }

          setBadge(document.getElementById('pending-badge'), incoming.length);
        } catch (e) {
          incomingList.innerHTML = '<div class="empty-line">申请列表加载失败</div>';
          showToast('好友申请加载失败: ' + e.message);
        }
      }

      async function search(keyword) {
        const results = document.getElementById('search-results');
        const status = document.getElementById('search-status');
        const trimmed = String(keyword || '').trim();
        if (!trimmed) {
          status.textContent = '请输入 UserID 或昵称';
          results.innerHTML = '';
          return;
        }
        lastSearchKeyword = trimmed;
        status.textContent = '搜索中...';
        try {
          const data = await apiPost('/api/user/search', {
            keyword: trimmed, limit: 50, offset: 0
          });
          const users = data.users || [];
          results.innerHTML = '';
          if (!users.length) {
            status.textContent = data.match_type === 'user_id'
              ? '该 UserID 不存在'
              : '没有找到这个昵称的用户';
            return;
          }
          status.textContent = data.match_type === 'user_id'
            ? '按 UserID 精确匹配到 1 个用户'
            : ('昵称“' + trimmed + '”匹配到 ' + users.length +
               ' 个用户，请按 UserID 区分');
          users.forEach(user => {
            results.appendChild(userCard(user,
              buildSearchActions(user)));
          });
        } catch (e) {
          status.textContent = '搜索失败: ' + e.message;
        }
      }

      function buildSearchActions(user) {
        if (user.relationship === 'self') {
          return [{ label: '这是你自己', disabled: true }];
        }
        if (user.relationship === 'friend') {
          return [{
            label: '发消息', primary: true,
            onClick: () => openChat(user.user_id)
          }];
        }
        if (user.relationship === 'pending_out') {
          return [{ label: '已申请', disabled: true }];
        }
        if (user.relationship === 'pending_in') {
          return [
            {
              label: '同意', primary: true,
              onClick: () => respond(user.request_id, 'accept')
            },
            {
              label: '拒绝', danger: true,
              onClick: () => respond(user.request_id, 'reject')
            }
          ];
        }
        return [{
          label: '加好友', primary: true,
          onClick: () => sendFriendRequest(user)
        }];
      }

      async function sendFriendRequest(user) {
        try {
          await apiPost('/api/friend/request', {
            to_user_id: Number(user.user_id),
            message: ''
          });
          showToast('好友申请已发送给 ' +
                    (user.name || ('User ' + user.user_id)));
          await Promise.all([loadRequests(), search(lastSearchKeyword)]);
        } catch (e) {
          if (e.status === 409) {
            showToast('对方已经发来申请或你们已是好友，正在刷新');
            await Promise.all([loadRequests(), loadFriends(),
                               search(lastSearchKeyword)]);
          } else {
            showToast('发送申请失败: ' + e.message);
          }
        }
      }

      async function respond(requestId, action) {
        try {
          await apiPost('/api/friend/respond', {
            request_id: Number(requestId),
            action: action
          });
          showToast(action === 'accept' ? '已添加好友' : '已拒绝申请');
          await Promise.all([
            loadRequests(), loadFriends(),
            lastSearchKeyword ? search(lastSearchKeyword) : Promise.resolve()
          ]);
        } catch (e) {
          showToast('处理申请失败: ' + e.message);
          await loadRequests();
        }
      }

      async function openChat(peerUserId) {
        try {
          await apiPost('/api/session/open_single', {
            peer_user_id: Number(peerUserId)
          });
          window.location.href = 'index.html?peer=' +
            encodeURIComponent(peerUserId);
        } catch (e) {
          if (e.status === 403) {
            showToast('还不是好友，请先发送好友申请');
          } else {
            showToast('打开会话失败: ' + e.message);
          }
        }
      }

      document.getElementById('search-form').addEventListener('submit', e => {
        e.preventDefault();
        search(document.getElementById('search-input').value);
      });
      document.getElementById('refresh-friends-btn').onclick = loadFriends;
      document.getElementById('refresh-requests-btn').onclick = loadRequests;

      loadSelf();
      loadFriends();
      loadRequests();

      const params = new URLSearchParams(window.location.search);
      const initialSearch = params.get('search');
      if (initialSearch) {
        document.getElementById('search-input').value = initialSearch;
        search(initialSearch);
      }

      // 好友申请 / 好友列表轮询：30 秒一次。
      pollTimer = setInterval(() => {
        loadRequests();
        loadFriends();
      }, 30000);
      window.addEventListener('beforeunload', () => {
        if (pollTimer) clearInterval(pollTimer);
      });
    })();
  </script>
</body>
</html>
