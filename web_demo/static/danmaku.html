<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MsgRail · 视频弹幕</title>
  <meta name="description" content="MsgRail 分布式消息推送系统 · 视频弹幕演示" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%232563eb'/%3E%3Cpath d='M5 17V8l7 4.5L19 8v9' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="ui/tokens.css" />
  <link rel="stylesheet" href="ui/base.css" />
  <link rel="stylesheet" href="ui/danmaku.css" />
  <script src="ui/theme.js"></script>
  <script src="ui/icons.js"></script>
  <script src="auth.js"></script>
</head>
<body class="dm-app">
  <header class="dm-header">
    <a class="brand" href="index.html" aria-label="MsgRail 消息中心">
      <span class="brand-mark">
        <svg class="mr-icon" aria-hidden="true"><use href="#i-logo"></use></svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">MsgRail</span>
        <span class="brand-sub">分布式消息推送系统</span>
      </span>
    </a>
    <div class="dm-header-actions">
      <a class="dm-back" href="index.html">
        <svg class="mr-icon" aria-hidden="true"><use href="#i-arrow-left"></use></svg>
        <span>返回消息中心</span>
      </a>
      <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="切换到深色模式" title="切换到深色模式">
        <svg class="mr-icon icon-sun" aria-hidden="true"><use href="#i-sun"></use></svg>
        <svg class="mr-icon icon-moon" aria-hidden="true"><use href="#i-moon"></use></svg>
      </button>
    </div>
  </header>

  <main class="dm-main">
    <div id="video-wrap">
      <video id="video" controls playsinline preload="metadata">
        <source src="demo.mp4" type="video/mp4" />
      </video>
      <div id="danmaku-layer" aria-hidden="true"></div>
      <div class="dm-stage-meta" aria-hidden="true">
        <span class="mr-pill"><span class="mr-dot"></span>ROOM 1001 · LIVE</span>
        <span class="dm-stage-title">Danmaku Rail</span>
      </div>
    </div>

    <div class="controls-container">
      <!-- 1. 登录前 -->
      <div id="guest-panel">
        <span class="guest-copy">登录后发送弹幕，和其他观众一起上轨。</span>
        <button class="mr-btn mr-btn-primary" type="button" onclick="openAuthModal()">登录 / 注册</button>
      </div>

      <!-- 2. 登录后 -->
      <div id="user-panel" class="hidden">
        <div class="dm-user">
          <span class="dm-user-label">当前用户</span>
          <span id="current-user-disp">-</span>
        </div>
        <input id="dm-input" placeholder="输入弹幕内容，Enter 发射" />
        <button class="mr-btn mr-btn-primary" type="button" id="send-dm-btn">
          <svg class="mr-icon" aria-hidden="true"><use href="#i-send"></use></svg>
          <span>发送弹幕</span>
        </button>
        <button class="mr-btn mr-btn-secondary" type="button" onclick="doLogout()">退出</button>
      </div>
    </div>

    <div class="dm-hint">
      <svg class="mr-icon" aria-hidden="true"><use href="#i-spark"></use></svg>
      <span>本页面模拟视频弹幕：登录后会连接 WebSocket 并自动加入 room_id=1001，弹幕按时间片预加载。</span>
    </div>
  </main>

  <!-- Login Modal -->
  <div id="auth-modal" class="mr-overlay hidden">
    <div class="mr-modal" role="dialog" aria-modal="true" aria-labelledby="auth-modal-title" onclick="event.stopPropagation()">
      <div class="mr-modal-header">
        <span class="mr-modal-title" id="auth-modal-title">登录 MsgRail</span>
        <button class="mr-close" type="button" onclick="closeAuthModal()" aria-label="关闭">
          <svg class="mr-icon" aria-hidden="true"><use href="#i-close"></use></svg>
        </button>
      </div>
      <div class="mr-modal-body">
        <div class="auth-tabs" role="tablist" aria-label="登录或注册">
          <button type="button" class="auth-tab active" data-mode="login" role="tab" aria-selected="true">登录</button>
          <button type="button" class="auth-tab" data-mode="register" role="tab" aria-selected="false">注册</button>
        </div>
        <div class="form-group">
          <input id="auth-account" class="form-control" placeholder="账号" autocomplete="username" />
        </div>
        <div class="form-group hidden" id="group-nickname">
          <input id="auth-nickname" class="form-control" placeholder="昵称" />
        </div>
        <div class="form-group">
          <input id="auth-password" type="password" class="form-control" placeholder="密码" autocomplete="current-password" />
        </div>
        <button id="login-btn" class="btn-primary btn-block">立即登录</button>
        <button id="register-btn" class="btn-primary btn-block hidden">注册并自动登录</button>
        <div id="auth-msg" class="status-text" role="status"></div>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const danmakuLayer = document.getElementById('danmaku-layer');
    const dmInput = document.getElementById('dm-input');
    const logicBase = window.location.protocol + '//' + window.location.hostname + ':9101';
    const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const cometWsUrl = wsProtocol + '//' + window.location.hostname + ':9200/ws';
    
    const videoId = 'demo_video_1';
    const danmakuRoomId = 1001;

    let ws = null;
    let currentUserId = null;
    let token = null;
    let wsReconnectTimer = null;
    let shouldReconnect = true;

    // 构造带 Authorization 的请求头
    function authHeaders() {
      const h = {'Content-Type': 'application/json'};
      if (token) h['Authorization'] = 'Bearer ' + token;
      return h;
    }

    function handleTokenExpired() {
      if (!token && !currentUserId) return;
      Auth.clear();
      shouldReconnect = false;
      clearTimeout(wsReconnectTimer);
      if (ws) {
        const socket = ws;
        ws = null;
        socket.onclose = null;
        socket.close();
      }
      currentUserId = null;
      token = null;
      updateUI();
      openAuthModal();
      document.getElementById('auth-msg').textContent = '登录状态已失效，请重新登录';
    }

    async function authenticatedFetch(url, options) {
      const res = await fetch(url, options);
      if (res.status === 401) {
        handleTokenExpired();
        return null;
      }
      return res;
    }
    const danmakus = []; 
    // 弹幕按时间片分段加载（毫秒），类似商业视频网站做时间分片预加载
    const DANMAKU_SLICE_MS = 60 * 1000; // 每片 60 秒
    const danmakuLoadedRanges = [];     // 已成功加载的时间段 [{from_ms,to_ms}]
    const danmakuLoadingKeys = new Set(); // 正在加载中的片段 key: "from-to"
    let lastPreloadCheckTime = -1;      // 上次预加载检查时的视频时间（秒）

    // Auth State
    // let authMode = 'login'; // Removed

    // --- UI ---
    function updateUI() {
       const guest = document.getElementById('guest-panel');
       const user = document.getElementById('user-panel');
       if (currentUserId) {
          guest.classList.add('hidden');
          user.classList.remove('hidden');
          document.getElementById('current-user-disp').textContent = currentUserId;
          closeAuthModal();
       } else {
          guest.classList.remove('hidden');
          user.classList.add('hidden');
       }
    }

    function openAuthModal() {
      document.getElementById('auth-modal').classList.remove('hidden');
      const t = document.querySelector('.auth-tab[data-mode="login"]');
      if(t) t.click();
      document.getElementById('auth-msg').textContent = '';
    }
    function closeAuthModal() {
      document.getElementById('auth-modal').classList.add('hidden');
    }

    // Tab Logic
    document.querySelectorAll('.auth-tab').forEach(btn => {
       btn.onclick = () => {
         document.querySelectorAll('.auth-tab').forEach(b => b.classList.remove('active'));
         btn.classList.add('active');
         const mode = btn.dataset.mode;
         const regBtn = document.getElementById('register-btn');
         const logBtn = document.getElementById('login-btn');
         const nickGroup = document.getElementById('group-nickname');
         
         if(mode === 'login') {
            regBtn.classList.add('hidden');
            logBtn.classList.remove('hidden');
            nickGroup.classList.add('hidden');
         } else {
            regBtn.classList.remove('hidden');
            logBtn.classList.add('hidden');
            nickGroup.classList.remove('hidden');
         }
         document.getElementById('auth-msg').textContent = '';
       };
    });

    // --- 弹幕渲染 ---
    function createDanmaku(text) {
      const el = document.createElement('span');
      el.className = 'danmaku-item';
      el.textContent = text;
      const layerH = danmakuLayer.clientHeight || 300;
      const laneMax = Math.max(0, layerH - 40);
      const top = Math.floor(Math.random() * laneMax);
      el.style.top = top + 'px';
      // 用图层宽度计算完整横穿距离，速度略带随机，避免所有弹幕重叠。
      el.style.setProperty('--dm-distance', (danmakuLayer.clientWidth || 960) + 'px');
      el.style.animationDuration = (7 + Math.random() * 3.5).toFixed(2) + 's';
      el.addEventListener('animationend', () => el.remove());
      danmakuLayer.appendChild(el);
    }

    function onRecvDanmaku(timelineMs, text) {
       const tSec = (timelineMs || 0) / 1000.0;
       danmakus.push({ time: tSec, text, displayed: false });
    }

    // --- 弹幕时间片管理 ---
    function isRangeLoaded(fromMs, toMs) {
      return danmakuLoadedRanges.some(r =>
        fromMs >= r.from_ms && toMs <= r.to_ms
      );
    }

    function markRangeLoaded(fromMs, toMs) {
      danmakuLoadedRanges.push({ from_ms: fromMs, to_ms: toMs });
    }

    async function loadDanmakuRange(fromMs, toMs) {
      if (fromMs < 0) fromMs = 0;
      if (toMs > 0 && toMs <= fromMs) return;
      if (isRangeLoaded(fromMs, toMs)) return;

      const key = fromMs + '-' + toMs;
      if (danmakuLoadingKeys.has(key)) return;
      danmakuLoadingKeys.add(key);

      try {
        const res = await fetch(logicBase + '/api/danmaku/list', {
          method:'POST',
          headers:authHeaders(),
          body:JSON.stringify({
            video_id: videoId,
            from_ms: fromMs,
            to_ms: toMs,
            limit: 2000
          })
        });
        const d = await res.json();
        if (d.code === 0 && d.data && Array.isArray(d.data.danmaku)) {
          d.data.danmaku.forEach(item => {
            onRecvDanmaku(item.timeline_ms, item.text);
          });
          markRangeLoaded(fromMs, toMs);
        }
      } catch(e) {
        console.error('loadDanmakuRange error', e);
      } finally {
        danmakuLoadingKeys.delete(key);
      }
    }

    function scheduleDanmakuPreload(curSeconds, force = false) {
      const cur = curSeconds || 0;
      // 默认每 5 秒做一次预加载检查，避免 timeupdate 过于频繁
      if (!force && lastPreloadCheckTime >= 0 && Math.abs(cur - lastPreloadCheckTime) < 5) {
        return;
      }
      lastPreloadCheckTime = cur;

      const curMs = Math.floor(cur * 1000);
      const baseSliceIndex = Math.floor(curMs / DANMAKU_SLICE_MS);
      const sliceIndices = [baseSliceIndex - 1, baseSliceIndex, baseSliceIndex + 1, baseSliceIndex + 2];

      sliceIndices.forEach(idx => {
        if (idx < 0) return;
        const fromMs = idx * DANMAKU_SLICE_MS;
        const toMs = fromMs + DANMAKU_SLICE_MS;
        loadDanmakuRange(fromMs, toMs);
      });
    }

    // --- 业务逻辑 ---
    async function doLoginOrRegister(mode) {
       const account = document.getElementById('auth-account').value.trim();
       const pwdRaw = document.getElementById('auth-password').value;
       const nickname = document.getElementById('auth-nickname').value.trim();
       const msgEl = document.getElementById('auth-msg');
       
       if(!account || !pwdRaw) return msgEl.textContent = '请填写完整';
       if(mode === 'register' && !nickname) return msgEl.textContent = '注册需填写昵称';

       msgEl.textContent = '处理中...';
       
       try {
          const url = logicBase + (mode === 'register' ? '/api/register' : '/api/login');
          const body = { account, password: hashPassword(pwdRaw) };
          if(mode === 'register') body.name = nickname;

          const resp = await fetch(url, {
             method:'POST', headers:{'Content-Type':'application/json'},
             body:JSON.stringify(body)
          });
          const data = await resp.json();
          
          if (data.code !== 0) {
             msgEl.textContent = data.message;
             return;
          }
          
          currentUserId = data.data.user_id;
          token = data.data.token;
          shouldReconnect = true;
          Auth.set(currentUserId, token, nickname || ('User ' + currentUserId));
          updateUI();
          connectWs();
       } catch(e) {
          msgEl.textContent = '网络错误: ' + e;
       }
    }

    function doLogout() {
      Auth.clear();
      shouldReconnect = false;
      clearTimeout(wsReconnectTimer);
      if(ws) {
        const socket = ws;
        ws = null;
        socket.onclose = null;
        socket.close();
      }
      currentUserId = null;
      token = null;
      updateUI();
    }
    
    function connectWs() {
       if (!token) return;
       if(ws) ws.close();
       const socket = new WebSocket(cometWsUrl + '?token=' + encodeURIComponent(token));
       let opened = false;
       ws = socket;
       socket.onopen = () => {
          if (socket !== ws) return;
          opened = true;
          console.log('WS Open');
          joinRoom();
       };
       socket.onmessage = (ev) => {
          if (socket !== ws) return;
          try {
             const obj = JSON.parse(ev.data);
             console.info('obj', obj);
             if (obj.type === 'danmaku' || obj.type === 'chatroom') {
                let t = ev.data;
                if (obj.content) {
                    if (typeof obj.content === 'string') t = obj.content;
                    else if (obj.content.text) t = obj.content.text;
                    else if (obj.content.content) {
                       // 嵌套兼容
                       if (typeof obj.content.content === 'string') t = obj.content.content;
                       else if (obj.content.content.text) t = obj.content.content.text;
                    }
                }
                const tl = obj.timeline_ms || 0;
                onRecvDanmaku(tl, t);
             }
          } catch(e){}
       };
       socket.onclose = () => {
          if (socket !== ws) return;
          ws = null;
          if (!shouldReconnect || !token) return;
          if (!opened) {
             verifyTokenAfterHandshakeFailure();
             return;
          }
          clearTimeout(wsReconnectTimer);
          wsReconnectTimer = setTimeout(connectWs, 1000);
       };
    }

    async function verifyTokenAfterHandshakeFailure() {
       if (!token) return;
       const tokenAtFailure = token;
       try {
          const res = await fetch(logicBase + '/api/chatroom/join', {
             method:'POST', headers:authHeaders(),
             body:JSON.stringify({ room_id: danmakuRoomId })
          });
          if (token !== tokenAtFailure) return;
          if (res.status === 401) {
             handleTokenExpired();
             return;
          }
       } catch (e) {
          console.warn('Token verification unavailable after WS failure:', e);
       }
       if (token === tokenAtFailure && shouldReconnect) {
          clearTimeout(wsReconnectTimer);
          wsReconnectTimer = setTimeout(connectWs, 1000);
       }
    }
    
    async function joinRoom() {
       const res = await authenticatedFetch(logicBase + '/api/chatroom/join', {
          method:'POST', headers:authHeaders(),
          body:JSON.stringify({ room_id: danmakuRoomId })
       });
       if (!res) return;
       if(ws && ws.readyState===1) ws.send(JSON.stringify({ type:'chatroom_join', group_id: danmakuRoomId }));
    }
    
    async function sendDanmaku() {
       const text = dmInput.value.trim();
       if(!text) return;
       if (!currentUserId || !token) {
          // 未登录则提示并弹出登录框
          alert('请先登录后再发送弹幕');
          openAuthModal();
          return;
       }
       const timelineMs = Math.floor((video.currentTime||0) * 1000);
       try {
          const res = await authenticatedFetch(logicBase + '/api/danmaku/send', {
             method:'POST', headers:authHeaders(),
             body:JSON.stringify({
               video_id: videoId,
               timeline_ms: timelineMs,
               text
             })
          });
          if (!res) return;
          const data = await res.json();
          if (data.code !== 0) {
             alert(data.message || '发送弹幕失败');
             return;
          }
          dmInput.value = '';
       } catch(e) { alert(e); }
    }

    // 首次进入页面时预加载从 0 开始的若干时间片
    function initDanmakuPreload() {
      // 这里不依赖 video.duration，直接从 0 预加载前几片，足够 使用
      scheduleDanmakuPreload(0, true);
    }

    // --- Event Loop for Video ---
    video.addEventListener('timeupdate', () => {
       const cur = video.currentTime;
       // 播放时按当前时间做时间片预加载
       scheduleDanmakuPreload(cur);
       for(const d of danmakus) {
          if(!d.displayed && d.time <= cur + 0.2) {
             d.displayed = true;
             createDanmaku(d.text);
          }
       }
    });
    video.addEventListener('seeked', () => {
       const cur = video.currentTime;
       // 跳转时强制触发一次预加载，避免 seek 到尚未加载区域时弹幕缺失
       scheduleDanmakuPreload(cur, true);
       for(const d of danmakus) {
          d.displayed = (d.time < cur - 0.5);
       }
    });

    document.getElementById('send-dm-btn').onclick = sendDanmaku;
    dmInput.onkeydown = (e) => { if(e.key==='Enter') sendDanmaku(); };

    document.getElementById('login-btn').onclick = () => doLoginOrRegister('login');
    document.getElementById('register-btn').onclick = () => doLoginOrRegister('register');
    document.getElementById('auth-password').onkeydown = (e) => {
       if(e.key==='Enter') {
          const isReg = !document.getElementById('register-btn').classList.contains('hidden');
          doLoginOrRegister(isReg ? 'register' : 'login');
       }
    };
    
    // 弹幕拉取无需登录，这里在页面加载完成后直接按时间片开始预加载
    initDanmakuPreload();

    // 自动登录
    const savedSession = Auth.get();
    if(savedSession) {
      currentUserId = Number(savedSession.user_id);
      token = savedSession.token;
      updateUI();
      connectWs();
    } else {
      updateUI();
    }
  </script>
</body>
</html>
