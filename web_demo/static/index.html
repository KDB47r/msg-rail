      </div>

      <nav class="auth-links" aria-label="其他演示页面">

  <script>
    // 全局变量
    let ws = null;
    let currentUserId = null;
    let token = null;
    let currentSessionId = null; // 当前选中的会话ID
    let currentPeerId = null;    // 当前聊天的对象ID
    let lastHistorySeq = 0;      // 历史消息最大seq，用于标记已读
    // 单聊历史分页状态
    let historyAnchorSeq = 0;    // 当前已加载历史中最早一条的 msg_seq
    let historyHasMore = true;   // 是否还有更多历史
    let historyLoading = false;  // 是否正在加载
    let currentAuthMode = 'login';
    // WebSocket 重连状态
    let wsManualClose = false;   // 主动登出关闭，不触发重连
    let wsRetryCount = 0;
    let wsRetryTimer = null;
    // 资料 / 未读角标
    let myProfile = null;
    let navPollTimer = null;
    // 消息右键 / 长按菜单与转发
    let messageMenuEl = null;
    let forwardSource = null;
    let forwardTargetId = 0;
    let forwardLoading = false;
    let longPressTimer = null;
    let suppressClickUntil = 0;

    // 配置
    const logicBase = window.location.protocol + '//' + window.location.hostname + ':9101';

    // 构造带 Authorization 的请求头
    function authHeaders() {
      const h = {'Content-Type': 'application/json'};
      if (token) h['Authorization'] = 'Bearer ' + token;
      return h;
    }

    // 统一 POST 封装：非 0 code 或非 2xx 都抛出带 status 的错误。
    async function apiPost(path, payload) {
      const resp = await fetch(logicBase + path, {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify(payload || {})
      });
      let body = {};
      try { body = await resp.json(); } catch (e) { body = {}; }
      if (!resp.ok || body.code !== 0) {
        const err = new Error(body.message || ('HTTP ' + resp.status));
        err.status = resp.status;
        throw err;
      }
      return body.data || {};
    }

    function setUnreadBadge(el, count) {
      if (!el) return;
      const n = Math.max(0, Number(count) || 0);
      el.textContent = n > 99 ? '99+' : String(n);
      el.classList.toggle('hidden', n <= 0);
    }
    const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const cometWsUrl = wsProtocol + '//' + window.location.hostname + ':9200/ws';

    // --- 媒体消息辅助 ---
    const mediaCache = new Map();
    let uploadingMedia = false;
    const MAX_IMAGE_BYTES = 20 * 1024 * 1024;
    const MAX_VIDEO_BYTES = 100 * 1024 * 1024;
    const MAX_FILE_BYTES = 50 * 1024 * 1024;

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // 从 content（可能是对象、JSON 字符串或包装过一层）里取出图片内容。
    function extractImageContent(content) {
      if (!content) return null;
      let c = content;
      if (typeof c === 'string') {
        try { c = JSON.parse(c); } catch (e) { return null; }
      }
      if (c && c.type === 'image' && c.media_id) return c;
      if (c && c.content && typeof c.content === 'object' &&
          c.content.type === 'image' && c.content.media_id) {
        return c.content;
      }
      return null;
    }

    // 与 extractImageContent 结构一致，只是 type 为 video。
    function extractVideoContent(content) {
      if (!content) return null;
      let c = content;
      if (typeof c === 'string') {
        try { c = JSON.parse(c); } catch (e) { return null; }
      }
      if (c && c.type === 'video' && c.media_id) return c;
      if (c && c.content && typeof c.content === 'object' &&
          c.content.type === 'video' && c.content.media_id) {
        return c.content;
      }
      return null;
    }

    // 与 extractImageContent 结构一致，只是 type 为 file。
    function extractFileContent(content) {
      if (!content) return null;
      let c = content;
      if (typeof c === 'string') {
        try { c = JSON.parse(c); } catch (e) { return null; }
      }
      if (c && c.type === 'file' && c.media_id) return c;
      if (c && c.content && typeof c.content === 'object' &&
          c.content.type === 'file' && c.content.media_id) {
        return c.content;
      }
      return null;
    }

    function formatBytes(n) {
      const value = Number(n) || 0;
      if (value <= 0) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB'];
      const idx = Math.min(
        Math.floor(Math.log(value) / Math.log(1024)), units.length - 1
      );
      const scaled = value / Math.pow(1024, idx);
      return (idx === 0 || scaled >= 10 ? Math.round(scaled) : scaled.toFixed(1)) +
             ' ' + units[idx];
    }

    function formatDuration(ms) {
      const total = Math.max(0, Math.floor((Number(ms) || 0) / 1000));
      const h = Math.floor(total / 3600);
      const m = Math.floor((total % 3600) / 60);
      const s = total % 60;
      const pad = n => (n < 10 ? '0' + n : String(n));
      return h > 0 ? h + ':' + pad(m) + ':' + pad(s) : m + ':' + pad(s);
    }

    function fileExtension(name) {
      const m = /\.([A-Za-z0-9]{1,8})$/.exec(name || '');
      return m ? m[1].toUpperCase().slice(0, 4) : 'FILE';
    }

    function fileIconColor(name, mime) {
      const ext = fileExtension(name).toLowerCase();
      if (ext === 'pdf') return '#e53935';
      if (ext === 'doc' || ext === 'docx') return '#1e88e5';
      if (ext === 'xls' || ext === 'xlsx' || ext === 'csv') return '#43a047';
      if (ext === 'ppt' || ext === 'pptx') return '#fb8c00';
      if (['zip', 'rar', '7z', 'gz', 'tar'].includes(ext)) return '#8e24aa';
      if ((mime || '').startsWith('image/')) return '#00897b';
      return '#607d8b';
    }

    // 文件下载：先换新签名 URL，再触发下载。签名 URL 带
    // response-content-disposition=attachment，浏览器不会直接渲染 HTML。
    async function downloadFileMessage(content) {
      try {
        const meta = await loadMediaMetadata(content.media_id, true);
        if (meta.status !== 'ready') {
          appendSystemMsg(meta.status === 'failed'
            ? '文件不可用：处理失败'
            : '文件尚未就绪，请稍后再试');
          return;
        }
        const url = meta.original && meta.original.url;
        if (!url) throw new Error('没有可用的下载地址');
        const a = document.createElement('a');
        a.href = url;
        a.download = content.name || meta.original_name || 'download.bin';
        a.rel = 'noopener';
        document.body.appendChild(a);
        a.click();
        a.remove();
      } catch (e) {
        appendSystemMsg('文件下载失败: ' + (e && e.message ? e.message : e));
      }
    }

    async function loadMediaMetadata(mediaId, force) {
      const now = Date.now();
      if (!force) {
        const hit = mediaCache.get(mediaId);
        if (hit && hit.expiresAt > now) return hit.data;
      }
      const resp = await fetch(
        logicBase + '/api/media/' + encodeURIComponent(mediaId),
        { method: 'GET', headers: authHeaders() }
      );
      const body = await resp.json();
      if (!resp.ok || body.code !== 0) {
        throw new Error(body.message || ('HTTP ' + resp.status));
      }
      const data = body.data || {};
      if (data.status === 'ready') {
        // 签名 URL 会在 expires_at 失效；缓存到最早过期时间前 30 秒。
        let expiresAt = now + 5 * 60 * 1000;
        const times = [];
        if (data.original && data.original.expires_at) {
          times.push(Number(data.original.expires_at));
        }
        Object.values(data.variants || {}).forEach(v => {
          if (v && v.expires_at) times.push(Number(v.expires_at));
        });
        if (times.length) {
          expiresAt = Math.min(expiresAt, Math.min(...times) * 1000 - 30000);
        }
        if (expiresAt <= now + 1000) expiresAt = now + 1000;
        mediaCache.set(mediaId, { data, expiresAt });
      }
      return data;
    }

    function pickVariant(meta, names) {
      const variants = (meta && meta.variants) || {};
      for (const name of names) {
        if (variants[name] && variants[name].url) return variants[name];
      }
      return null;
    }

    // 气泡直接用 320px thumb 清晰显示；
    // micro 只用于 lightbox 打开瞬间的占位，点开后再换成 preview。
    async function hydrateImageBubble(img, content, stateEl, attempt) {
      const tries = attempt || 0;
      if (!img.isConnected) return;
      try {
        // history 已内嵌 ready/failed 的 media 时直接使用；
        // processing 或缺失时再走单张接口轮询最新状态。
        const embedded = content.media;
        const meta = (embedded &&
          (embedded.status === 'ready' || embedded.status === 'failed'))
          ? embedded
          : await loadMediaMetadata(content.media_id);
        if (meta.status === 'ready') {
          const display = pickVariant(meta, ['thumb', 'micro', 'preview']) ||
                          meta.original;
          if (!display || !display.url) throw new Error('没有可用的缩略图');
          img.onload = () => {
            if (stateEl && stateEl.parentNode) stateEl.remove();
          };
          img.src = display.url;
          return;
        }
        if (meta.status === 'failed') {
          if (stateEl) stateEl.textContent = '图片处理失败';
          return;
        }
        if (stateEl) stateEl.textContent = '处理中...';
        if (tries < 60) {
          setTimeout(() => hydrateImageBubble(img, content, stateEl, tries + 1), 500);
        } else if (stateEl) {
          stateEl.textContent = '处理超时';
        }
      } catch (e) {
        if (tries < 3) {
          setTimeout(() => hydrateImageBubble(img, content, stateEl, tries + 1), 1000);
        } else if (stateEl) {
          stateEl.textContent = '图片加载失败';
        }
      }
    }

    async function openImageLightbox(content) {
      closeVideoLightbox();
      const box = document.getElementById('image-lightbox');
      const img = document.getElementById('lightbox-img');
      const caption = document.getElementById('lightbox-caption');
      const original = document.getElementById('lightbox-original');
      box.classList.add('show');
      img.classList.remove('clear');
      img.removeAttribute('src');
      caption.textContent = content.caption || '';
      original.style.display = 'none';
      try {
        const meta = await loadMediaMetadata(content.media_id, true);
        if (meta.status !== 'ready') {
          caption.textContent = meta.status === 'failed'
            ? '图片处理失败'
            : '图片仍在处理中，请稍后再试';
          return;
        }
        const micro = pickVariant(meta, ['micro', 'thumb']);
        const preview = pickVariant(meta, ['preview', 'thumb']) || meta.original;
        if (micro && micro.url) img.src = micro.url;
        if (preview && preview.url) {
          const preload = new Image();
          preload.onload = () => {
            img.src = preview.url;
            img.classList.add('clear');
          };
          preload.onerror = () => {
            if (meta.original && meta.original.url) img.src = meta.original.url;
            img.classList.add('clear');
          };
          preload.src = preview.url;
        } else if (meta.original && meta.original.url) {
          img.src = meta.original.url;
          img.classList.add('clear');
        }
        if (meta.original && meta.original.url) {
          original.href = meta.original.url;
          original.style.display = 'inline-block';
        }
      } catch (e) {
        caption.textContent = '图片加载失败: ' + (e.message || e);
      }
    }

    function closeImageLightbox() {
      document.getElementById('image-lightbox').classList.remove('show');
      const img = document.getElementById('lightbox-img');
      img.removeAttribute('src');
      img.classList.remove('clear');
    }

    // 视频卡片的 poster 是 640px JPEG，聊天列表不加载原视频。
    async function hydrateVideoPoster(content, img, stateEl, attempt) {
      const tries = attempt || 0;
      if (!img.isConnected) return;
      try {
        const embedded = content.media;
        const meta = (embedded &&
          (embedded.status === 'ready' || embedded.status === 'failed'))
          ? embedded
          : await loadMediaMetadata(content.media_id);
        if (meta.status === 'ready') {
          const poster = pickVariant(meta, ['poster']);
          if (poster && poster.url) {
            img.onload = () => {
              if (stateEl && stateEl.parentNode) stateEl.remove();
            };
            img.src = poster.url;
          } else if (stateEl) {
            stateEl.textContent = '封面加载失败';
          }
          return;
        }
        if (meta.status === 'failed') {
          if (stateEl) stateEl.textContent = '视频处理失败';
          return;
        }
        if (stateEl) stateEl.textContent = '处理中...';
        if (tries < 60) {
          setTimeout(() => hydrateVideoPoster(content, img, stateEl, tries + 1), 500);
        } else if (stateEl) {
          stateEl.textContent = '处理超时';
        }
      } catch (e) {
        if (tries < 3) {
          setTimeout(() => hydrateVideoPoster(content, img, stateEl, tries + 1), 1000);
        } else if (stateEl) {
          stateEl.textContent = '封面加载失败';
        }
      }
    }

    // 每次打开都强制刷新元数据，避免使用即将过期的签名 URL。
    async function openVideoLightbox(content) {
      closeImageLightbox();
      const box = document.getElementById('video-lightbox');
      const video = document.getElementById('lightbox-video');
      const caption = document.getElementById('video-lightbox-caption');
      box.classList.add('show');
      video.pause();
      video.removeAttribute('src');
      video.removeAttribute('poster');
      video.load();
      caption.textContent = content.caption || '';
      try {
        const meta = await loadMediaMetadata(content.media_id, true);
        if (meta.status !== 'ready') {
          caption.textContent = meta.status === 'failed'
            ? '视频处理失败'
            : '视频仍在处理中，请稍后再试';
          return;
        }
        const poster = pickVariant(meta, ['poster']);
        if (poster && poster.url) video.poster = poster.url;
        const original = meta.original && meta.original.url;
        if (!original) {
          caption.textContent = '没有可用的视频地址';
          return;
        }
        video.src = original;
        video.load();
        video.play().catch(() => {});
      } catch (e) {
        caption.textContent = '视频加载失败: ' + (e.message || e);
      }
    }

    function setUploadStatus(text) {
      const el = document.getElementById('upload-status');
      if (!el) return;
      if (!text) {
        el.style.display = 'none';
        el.textContent = '';
      } else {
        el.style.display = 'block';
        el.textContent = text;
      }
    }

    function guessImageMime(file) {
      if (file.type === 'image/jpeg' || file.type === 'image/png' ||
          file.type === 'image/webp') {
        return file.type;
      }
      const name = (file.name || '').toLowerCase();
      if (name.endsWith('.jpg') || name.endsWith('.jpeg')) return 'image/jpeg';
      if (name.endsWith('.png')) return 'image/png';
      if (name.endsWith('.webp')) return 'image/webp';
      return '';
    }

    function guessVideoMime(file) {
      if (file.type === 'video/mp4' || file.type === 'video/webm') {
        return file.type;
      }
      const name = (file.name || '').toLowerCase();
      if (name.endsWith('.mp4')) return 'video/mp4';
      if (name.endsWith('.webm')) return 'video/webm';
      return '';
    }

    // XHR 而不是 fetch：需要上传进度；PUT 直传 MinIO，不带业务 Authorization。
    function uploadFileWithProgress(url, file, contentType, onProgress, timeoutMs) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('PUT', url, true);
        xhr.timeout = timeoutMs || 60000;
        xhr.setRequestHeader('Content-Type', contentType);
        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable && onProgress) {
            onProgress(Math.round(e.loaded * 100 / e.total));
          }
        };
        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300) resolve();
          else reject(new Error('直传失败 HTTP ' + xhr.status));
        };
        xhr.onerror = () => reject(new Error('直传网络错误，请检查 MinIO 与 CORS'));
        xhr.ontimeout = () => reject(new Error('直传超时'));
        xhr.send(file);
      });
    }

    // ---- 视频 multipart 上传与断点续传 ----
    const VIDEO_UPLOAD_STATE_PREFIX = 'sparkpush.upload.video.v1.';

    function videoStateHash(text) {
      let h = 0x811c9dc5;
      for (let i = 0; i < text.length; ++i) {
        h ^= text.charCodeAt(i);
        h = Math.imul(h, 0x01000193) >>> 0;
      }
      return h.toString(16);
    }

    function videoStateKey(file) {
      return VIDEO_UPLOAD_STATE_PREFIX + videoStateHash(
        [file.name || '', file.size, file.lastModified || 0].join('|'));
    }

    function loadVideoUploadState(file) {
      try {
        const raw = localStorage.getItem(videoStateKey(file));
        if (!raw) return null;
        const state = JSON.parse(raw);
        if (String(state.file_name || '') !== String(file.name || '') ||
            Number(state.file_size) !== Number(file.size) ||
            Number(state.last_modified || 0) !== Number(file.lastModified || 0)) {
          return null;
        }
        if (state.expires_at && Date.now() / 1000 > Number(state.expires_at)) {
          localStorage.removeItem(videoStateKey(file));
          return null;
        }
        return state;
      } catch (e) {
        return null;
      }
    }

    function saveVideoUploadState(file, state) {
      try {
        localStorage.setItem(videoStateKey(file), JSON.stringify(state));
      } catch (e) {
        // localStorage 不可用不影响这次上传，只是不能跨刷新续传。
      }
    }

    function clearVideoUploadState(file) {
      try { localStorage.removeItem(videoStateKey(file)); } catch (e) {}
    }

    // UploadPart：每个分片独立进度，失败时把 HTTP status 带出来。
    function uploadPartWithProgress(url, blob, onProgress, timeoutMs) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('PUT', url, true);
        xhr.timeout = timeoutMs || 300000;
        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable && onProgress) onProgress(e.loaded);
        };
        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            resolve();
          } else {
            const err = new Error('分片上传失败 HTTP ' + xhr.status);
            err.status = xhr.status;
            reject(err);
          }
        };
        xhr.onerror = () => reject(new Error('分片上传网络错误，请检查 MinIO 与 CORS'));
        xhr.ontimeout = () => reject(new Error('分片上传超时'));
        xhr.send(blob);
      });
    }

    async function runUploadPool(items, limit, fn) {
      let next = 0;
      const runners = [];
      for (let i = 0; i < Math.min(limit, items.length); ++i) {
        runners.push((async () => {
          while (true) {
            const index = next++;
            if (index >= items.length) return;
            await fn(items[index]);
          }
        })());
      }
      await Promise.all(runners);
    }

    async function fetchMultipartStatus(mediaId) {
      try {
        return await apiPost('/api/media/upload/multipart/status',
                             {media_id: mediaId});
      } catch (e) {
        if (e.status === 404 || e.status === 409) return null;
        throw e;
      }
    }

    function multipartPartSize(n, partSize, partCount, totalSize) {
      if (n < partCount) return partSize;
      return Math.max(0, totalSize - partSize * (partCount - 1));
    }

    async function uploadMissingParts(file, mediaId, partSize, partCount,
                                       uploadedSet, opts) {
      const missing = [];
      for (let n = 1; n <= partCount; ++n) {
        if (!uploadedSet.has(n)) missing.push(n);
      }
      if (!missing.length) return;

      let completedBytes = 0;
      uploadedSet.forEach(n => {
        completedBytes += multipartPartSize(n, partSize, partCount, file.size);
      });
      const partProgress = new Map();
      const updateProgress = () => {
        let current = 0;
        partProgress.forEach(v => { current += v; });
        const pct = Math.min(99, Math.round(
          (completedBytes + current) * 100 / Math.max(1, file.size)));
        setUploadStatus('上传中 ' + pct + '%');
      };

      const batchSize = 20;
      for (let start = 0; start < missing.length; start += batchSize) {
        const batch = missing.slice(start, start + batchSize);
        const partList = await apiPost(
          '/api/media/upload/multipart/part_urls',
          {media_id: mediaId, part_numbers: batch});
        const urls = new Map();
        (partList.parts || []).forEach(p => {
          urls.set(Number(p.part_number), p.url);
        });

        await runUploadPool(batch, 3, async (n) => {
          let url = urls.get(n);
          if (!url) throw new Error('服务端没有返回分片 ' + n + ' 的上传地址');
          const begin = (n - 1) * partSize;
          const end = Math.min(file.size, begin + partSize);
          if (end <= begin) throw new Error('分片 ' + n + ' 范围为空');
          const blob = file.slice(begin, end);
          let attempt = 0;
          while (true) {
            try {
              await uploadPartWithProgress(
                url, blob,
                loaded => {
                  partProgress.set(n, Math.min(loaded, blob.size));
                  updateProgress();
                },
                opts.partTimeoutMs || 300000);
              partProgress.set(n, blob.size);
              completedBytes += blob.size;
              uploadedSet.add(n);
              updateProgress();
              return;
            } catch (e) {
              attempt++;
              if (attempt >= 3) {
                throw new Error('分片 ' + n + ' 上传失败: ' + e.message);
              }
              partProgress.set(n, 0);
              updateProgress();
              if (e.status === 403) {
                // 预签名 URL 过期，换新 URL 再试。
                try {
                  const refreshed = await apiPost(
                    '/api/media/upload/multipart/part_urls',
                    {media_id: mediaId, part_numbers: [n]});
                  const item = (refreshed.parts || [])[0];
                  if (item && item.url) url = item.url;
                } catch (refreshErr) {
                  // 保留原错误，继续退避重试。
                }
              }
              await sleep(500 * attempt);
            }
          }
        });
      }
    }

    async function waitForMediaReady(mediaId, label, opts) {
      let meta = null;
      const pollMax = (opts && opts.pollAttempts) || 60;
      for (let i = 0; i < pollMax; ++i) {
        meta = await loadMediaMetadata(mediaId, true);
        if (meta.status === 'ready') return meta;
        if (meta.status === 'failed') {
          throw new Error(meta.error || (label + '处理失败'));
        }
        await sleep(500);
      }
      throw new Error(label + '处理超时');
    }

    async function uploadVideoMultipart(file, mime, label, opts) {
      const state = loadVideoUploadState(file);
      let mediaId = null;
      let partSize = 0;
      let partCount = 0;
      let uploadedSet = new Set();
      let serverStatus = '';

      if (state) {
        setUploadStatus('检查断点...');
        const status = await fetchMultipartStatus(state.media_id);
        if (status) {
          mediaId = state.media_id;
          serverStatus = status.status || 'init';
          partSize = Number(status.part_size) || Number(state.part_size) || 0;
          partCount = Number(status.part_count) || Number(state.part_count) || 0;
          (status.uploaded_parts || []).forEach(p => {
            uploadedSet.add(Number(p.part_number));
          });
        } else {
          // 会话可能已完成/过期；先看 media 是否已经 ready/processing。
          try {
            const meta = await loadMediaMetadata(state.media_id, true);
            if (meta.status === 'ready' || meta.status === 'processing' ||
                meta.status === 'uploaded') {
              mediaId = state.media_id;
              serverStatus = meta.status;
            }
          } catch (e) {}
          if (!mediaId) clearVideoUploadState(file);
        }
      }

      if (!mediaId) {
        setUploadStatus('初始化上传...');
        const init = await apiPost('/api/media/upload/init', {
          kind: 'video',
          mime_type: mime,
          size_bytes: file.size,
          filename: file.name || 'video',
          multipart: true
        });
        if (init.upload_method !== 'multipart') {
          throw new Error('服务端未启用视频分片上传');
        }
        mediaId = init.media_id;
        partSize = Number(init.part_size);
        partCount = Number(init.part_count);
        serverStatus = 'init';
        uploadedSet = new Set();
        saveVideoUploadState(file, {
          media_id: mediaId,
          part_size: partSize,
          part_count: partCount,
          expires_at: Number(init.expires_at) || 0,
          file_name: file.name || '',
          file_size: file.size,
          last_modified: file.lastModified || 0
        });
      }

      if (partSize <= 0 || partCount <= 0 || partCount > 10000) {
        throw new Error('服务端返回的分片参数无效');
      }
      if (serverStatus === 'failed') {
        throw new Error('视频处理失败，请重新上传');
      }

      if (serverStatus === 'uploaded') {
        setUploadStatus('确认上传...');
        await apiPost('/api/media/upload/complete', {media_id: mediaId});
      } else if (serverStatus !== 'ready' && serverStatus !== 'processing') {
        await uploadMissingParts(file, mediaId, partSize, partCount,
                                 uploadedSet, opts || {});
        // complete 可能因为最后一片还没落盘/并发返回 409；补传后重试。
        for (let attempt = 0; ; ++attempt) {
          try {
            setUploadStatus('确认上传...');
            await apiPost('/api/media/upload/complete', {media_id: mediaId});
            break;
          } catch (e) {
            if (e.status !== 409 || attempt >= 2) throw e;
            const status = await fetchMultipartStatus(mediaId);
            if (!status) throw e;
            partSize = Number(status.part_size) || partSize;
            partCount = Number(status.part_count) || partCount;
            uploadedSet = new Set(
              (status.uploaded_parts || []).map(p => Number(p.part_number)));
            await uploadMissingParts(file, mediaId, partSize, partCount,
                                     uploadedSet, opts || {});
          }
        }
      }

      setUploadStatus(label === '视频'
        ? '服务端处理视频（必要时转码）...'
        : '服务端处理中...');
      const meta = await waitForMediaReady(mediaId, label, opts || {});
      clearVideoUploadState(file);
      return {mediaId, meta};
    }

    // 上传期间锁住加号与已启用的附件入口，避免并发上传互相覆盖状态提示。
    function setAttachmentBusy(busy) {
      ['plus-btn', 'attach-image', 'attach-video', 'attach-file'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.disabled = busy;
      });
    }

    // 浏览器给不出类型时退化为通用二进制，服务端仍会校验格式。
    function guessFileMime(file) {
      const mime = (file.type || '').trim();
      if (mime && mime.includes('/') && mime.length <= 128 &&
          !/[\s"\\]/.test(mime)) {
        return mime;
      }
      return 'application/octet-stream';
    }

    // 图片/视频/文件共用的直传流程：init -> PUT MinIO -> complete -> 等 ready。
    // 返回 media_id 与最新元数据（文件在 complete 时已同步 ready）。
    async function uploadMediaAsset(file, kind, mime, label, options) {
      const opts = options || {};
      if (kind === 'video') {
        return await uploadVideoMultipart(file, mime, label, opts);
      }
      setUploadStatus('上传中 0%');
      const initResp = await fetch(logicBase + '/api/media/upload/init', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({
          kind: kind,
          mime_type: mime,
          size_bytes: file.size,
          filename: file.name ||
            (kind === 'image' ? 'upload' : (kind === 'video' ? 'video' : 'file.bin'))
        })
      });
      const initBody = await initResp.json();
      if (!initResp.ok || initBody.code !== 0) {
        throw new Error(initBody.message || ('初始化失败 HTTP ' + initResp.status));
      }
      const mediaId = initBody.data.media_id;
      await uploadFileWithProgress(
        initBody.data.upload_url, file, mime,
        pct => setUploadStatus('上传中 ' + pct + '%'),
        opts.timeoutMs || 60000
      );

      setUploadStatus(
        kind === 'file' ? '确认上传...'
          : (kind === 'video' ? '服务端处理视频（必要时转码）...'
                              : '服务端处理中...')
      );
      const doneResp = await fetch(logicBase + '/api/media/upload/complete', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ media_id: mediaId })
      });
      const doneBody = await doneResp.json();
      if (!doneResp.ok || doneBody.code !== 0) {
        throw new Error(doneBody.message || ('确认上传失败 HTTP ' + doneResp.status));
      }

      const meta = await waitForMediaReady(mediaId, label, opts);
      return { mediaId, meta };
    }

    async function sendImageFile(file) {
      if (!file) return;
      if (!currentPeerId) {
        alert('请先选择聊天对象');
        return;
      }
      if (!token) {
        appendSystemMsg('登录状态已失效，请重新登录');
        return;
      }
      if (uploadingMedia) return;
      const mime = guessImageMime(file);
      if (!mime) {
        alert('只支持 JPEG / PNG / WebP 图片');
        return;
      }
      if (file.size <= 0 || file.size > MAX_IMAGE_BYTES) {
        alert('图片大小必须在 20 MiB 以内');
        return;
      }
      const caption = document.getElementById('msg-text').value.trim();
      if (Array.from(caption).length > 500) {
        alert('图片说明不能超过 500 字');
        return;
      }

      uploadingMedia = true;
      setAttachPanel(false);
      setAttachmentBusy(true);
      const input = document.getElementById('image-file');
      try {
        const { mediaId, meta } =
          await uploadMediaAsset(file, 'image', mime, '图片');

        setUploadStatus('发送中...');
        const sendResp = await fetch(logicBase + '/api/message/send', {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify({
            to_user_id: Number(currentPeerId),
            msg_type: 'image',
            media_id: mediaId,
            caption: caption
          })
        });
        const sendBody = await sendResp.json();
        if (!sendResp.ok || sendBody.code !== 0) {
          throw new Error(sendBody.message || ('发送失败 HTTP ' + sendResp.status));
        }

        const sent = sendBody.data || {};
        const imageContent = {
          type: 'image',
          media_id: mediaId,
          width: meta.width,
          height: meta.height,
          dominant_color: meta.dominant_color,
          caption: caption
        };
        appendMsgRow(imageContent, true, currentUserId, undefined, {
          msg: {
            session_id: sent.session_id,
            msg_id: sent.msg_id,
            msg_seq: sent.msg_seq,
            msg_type: 'image',
            content: imageContent
          }
        });
        document.getElementById('msg-text').value = '';
      } catch (e) {
        appendSystemMsg('图片发送失败: ' + (e && e.message ? e.message : e));
      } finally {
        uploadingMedia = false;
        setAttachmentBusy(false);
        if (input) input.value = '';
        setUploadStatus('');
      }
    }

    // 普通文件：走同一套 MinIO 直传；服务端不转码，complete 后立即 ready。
    async function sendGenericFile(file) {
      if (!file) return;
      if (!currentPeerId) {
        alert('请先选择聊天对象');
        return;
      }
      if (!token) {
        appendSystemMsg('登录状态已失效，请重新登录');
        return;
      }
      if (uploadingMedia) return;
      if (file.size <= 0 || file.size > MAX_FILE_BYTES) {
        alert('文件大小必须在 50 MiB 以内');
        return;
      }
      const caption = document.getElementById('msg-text').value.trim();
      if (Array.from(caption).length > 500) {
        alert('文件说明不能超过 500 字');
        return;
      }
      const mime = guessFileMime(file);

      uploadingMedia = true;
      setAttachPanel(false);
      setAttachmentBusy(true);
      const input = document.getElementById('generic-file');
      try {
        const { mediaId, meta } =
          await uploadMediaAsset(file, 'file', mime, '文件');

        setUploadStatus('发送中...');
        const sendResp = await fetch(logicBase + '/api/message/send', {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify({
            to_user_id: Number(currentPeerId),
            msg_type: 'file',
            media_id: mediaId,
            caption: caption
          })
        });
        const sendBody = await sendResp.json();
        if (!sendResp.ok || sendBody.code !== 0) {
          throw new Error(sendBody.message || ('发送失败 HTTP ' + sendResp.status));
        }

        const sent = sendBody.data || {};
        const fileContent = {
          type: 'file',
          media_id: mediaId,
          name: meta.original_name || file.name || 'file.bin',
          mime_type: meta.mime_type || mime,
          size_bytes: meta.size_bytes || file.size,
          caption: caption
        };
        appendMsgRow(fileContent, true, currentUserId, undefined, {
          msg: {
            session_id: sent.session_id,
            msg_id: sent.msg_id,
            msg_seq: sent.msg_seq,
            msg_type: 'file',
            content: fileContent
          }
        });
        document.getElementById('msg-text').value = '';
      } catch (e) {
        appendSystemMsg('文件发送失败: ' + (e && e.message ? e.message : e));
      } finally {
        uploadingMedia = false;
        setAttachmentBusy(false);
        if (input) input.value = '';
        setUploadStatus('');
      }
    }

    // --- 消息右键/长按菜单与转发 ---
    function ensureMessageMenu() {
      if (!messageMenuEl) {
        messageMenuEl = document.getElementById('message-menu');
      }
      return messageMenuEl;
    }

    function closeMessageMenu() {
      if (messageMenuEl) messageMenuEl.hidden = true;
    }

    function copyMessageText(text) {
      const value = typeof text === 'string' ? text : '';
      if (!value) return;
      const done = () => showToast('已复制');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(value).then(done).catch(() => {
          showToast('复制失败');
        });
      } else {
        showToast('当前浏览器不支持复制');
      }
    }

    function openMessageMenu(x, y, ctx) {
      const menu = ensureMessageMenu();
      if (!menu || !ctx) return;
      menu.innerHTML = '';
      const items = [];
      if (Number(ctx.msgSeq) > 0) {
        items.push({
          label: '转发',
          action: () => openForwardModal(ctx)
        });
      }
      const content = ctx.content;
      if (typeof content === 'string') {
        items.push({
          label: '复制文本',
          action: () => copyMessageText(content)
        });
      } else if (content && content.type === 'image') {
        items.push({
          label: '查看大图',
          action: () => openImageLightbox(content)
        });
      } else if (content && content.type === 'video') {
        items.push({
          label: '播放视频',
          action: () => openVideoLightbox(content)
        });
      } else if (content && content.type === 'file') {
        items.push({
          label: '下载文件',
          action: () => downloadFileMessage(content)
        });
      }
      if (!items.length) return;

      items.forEach(item => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = item.label;
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          closeMessageMenu();
          item.action();
        });
        menu.appendChild(btn);
      });

      menu.hidden = false;
      menu.style.left = '0px';
      menu.style.top = '0px';
      const rect = menu.getBoundingClientRect();
      const left = Math.max(8, Math.min(x, window.innerWidth - rect.width - 8));
      const top = Math.max(8, Math.min(y, window.innerHeight - rect.height - 8));
      menu.style.left = left + 'px';
      menu.style.top = top + 'px';
      const first = menu.querySelector('button');
      if (first) first.focus();
    }

    function closeForwardModal() {
      const modal = document.getElementById('forward-modal');
      if (modal) modal.hidden = true;
      forwardSource = null;
      forwardTargetId = 0;
      const input = document.getElementById('forward-user-id');
      if (input) input.value = '';
    }

    function renderForwardSessions(sessions) {
      const list = document.getElementById('forward-session-list');
      if (!list) return;
      list.innerHTML = '';
      const seen = new Set();
      let count = 0;
      (sessions || []).forEach(s => {
        const uid = Number(s.peer_user_id);
        if (!uid || seen.has(uid)) return;
        seen.add(uid);
        count++;
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'forward-session-item';
        const avatar = document.createElement('div');
        avatar.className = 'avatar-placeholder';
        const profile = {
          user_id: uid,
          name: s.peer_name || ('User ' + uid),
          avatar_media_id: s.peer_avatar_media_id || '',
          avatar_url: s.peer_avatar_url || '',
          avatar_expires_at: s.peer_avatar_expires_at || 0
        };
        UserProfile.prime(profile);
        UserProfile.applyAvatar(avatar, profile, uid);
        const name = document.createElement('span');
        name.className = 'forward-name';
        name.textContent = profile.name;
        const id = document.createElement('span');
        id.className = 'forward-uid';
        id.textContent = 'ID ' + uid;
        item.appendChild(avatar);
        item.appendChild(name);
        item.appendChild(id);
        item.addEventListener('click', () => {
          forwardTargetId = uid;
          const input = document.getElementById('forward-user-id');
          if (input) input.value = '';
          list.querySelectorAll('.forward-session-item').forEach(el => {
            el.classList.toggle('selected', el === item);
          });
        });
        list.appendChild(item);
      });
      if (!count) {
        const empty = document.createElement('div');
        empty.className = 'forward-hint';
        empty.textContent = '暂无已有单聊，请直接输入 UserID';
        list.appendChild(empty);
      }
    }

    async function openForwardModal(ctx) {
      closeMessageMenu();
      if (!ctx || Number(ctx.msgSeq) <= 0) {
        showToast('消息尚未同步，请稍后再试');
        return;
      }
      forwardSource = ctx;
      forwardTargetId = 0;
      const modal = document.getElementById('forward-modal');
      const list = document.getElementById('forward-session-list');
      const input = document.getElementById('forward-user-id');
      if (input) input.value = '';
      if (list) {
        list.innerHTML = '<div class="forward-hint">加载会话列表...</div>';
      }
      if (modal) modal.hidden = false;
      try {
        const data = await apiPost('/api/session/list_single', {});
        renderForwardSessions(data.sessions || []);
      } catch (e) {
        if (list) {
          list.innerHTML = '<div class="forward-hint">会话列表加载失败，请直接输入 UserID</div>';
        }
      }
    }

    async function confirmForward() {
      if (forwardLoading || !forwardSource) return;
      const input = document.getElementById('forward-user-id');
      const target = Number(input && input.value) || Number(forwardTargetId);
      if (!target || target <= 0) {
        showToast('请选择或输入目标用户');
        return;
      }
      const btn = document.getElementById('forward-confirm');
      forwardLoading = true;
      if (btn) btn.disabled = true;
      try {
        await apiPost('/api/message/forward', {
          source_session_id: forwardSource.sessionId,
          source_msg_seq: forwardSource.msgSeq,
          to_user_id: target
        });
        closeForwardModal();
        showToast('已转发');
        if (Number(target) === Number(currentPeerId)) {
          // 转发接口只保证 Kafka 已接收，给 Job 一点持久化时间再刷新历史。
          await new Promise(resolve => setTimeout(resolve, 300));
          await loadHistory(true);
        } else {
          loadSingleSessionList();
        }
      } catch (e) {
        showToast('转发失败: ' + (e && e.message ? e.message : e));
      } finally {
        forwardLoading = false;
        if (btn) btn.disabled = false;
      }
    }

    (function setupMessageMenuEvents() {
      const messagesEl = document.getElementById('messages');
      if (!messagesEl) return;

      messagesEl.addEventListener('contextmenu', (e) => {
        const row = e.target.closest('.msg-row');
        if (!row || !row.__msgContext) return;
        e.preventDefault();
        openMessageMenu(e.clientX, e.clientY, row.__msgContext);
      });

      let startX = 0;
      let startY = 0;
      messagesEl.addEventListener('touchstart', (e) => {
        const row = e.target.closest('.msg-row');
        if (!row || !e.touches || e.touches.length !== 1) return;
        const touch = e.touches[0];
        startX = touch.clientX;
        startY = touch.clientY;
        if (longPressTimer) clearTimeout(longPressTimer);
        longPressTimer = setTimeout(() => {
          longPressTimer = null;
          const ctx = row.__msgContext;
          if (!ctx) return;
          openMessageMenu(startX, startY, ctx);
          suppressClickUntil = Date.now() + 800;
        }, 550);
      }, { passive: true });

      messagesEl.addEventListener('touchmove', (e) => {
        if (!longPressTimer || !e.touches || !e.touches.length) return;
        const touch = e.touches[0];
        if (Math.hypot(touch.clientX - startX, touch.clientY - startY) > 10) {
          clearTimeout(longPressTimer);
          longPressTimer = null;
        }
      }, { passive: true });

      ['touchend', 'touchcancel'].forEach(name => {
        messagesEl.addEventListener(name, () => {
          if (longPressTimer) clearTimeout(longPressTimer);
          longPressTimer = null;
        }, { passive: true });
      });

      messagesEl.addEventListener('click', (e) => {
        if (Date.now() < suppressClickUntil) {
          e.preventDefault();
          e.stopPropagation();
        }
      }, true);

      document.addEventListener('click', (e) => {
        const menu = ensureMessageMenu();
        if (menu && !menu.hidden && !menu.contains(e.target)) {
          closeMessageMenu();
        }
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeMessageMenu();
          closeForwardModal();
        }
      });
      window.addEventListener('resize', closeMessageMenu);
      window.addEventListener('scroll', closeMessageMenu, true);

      const closeBtn = document.getElementById('forward-close');
      const cancelBtn = document.getElementById('forward-cancel');
      const confirmBtn = document.getElementById('forward-confirm');
      const modal = document.getElementById('forward-modal');
      const userIdInput = document.getElementById('forward-user-id');
      if (closeBtn) closeBtn.addEventListener('click', closeForwardModal);
      if (cancelBtn) cancelBtn.addEventListener('click', closeForwardModal);
      if (confirmBtn) confirmBtn.addEventListener('click', confirmForward);
      if (userIdInput) {
        userIdInput.addEventListener('input', () => {
          forwardTargetId = 0;
          const list = document.getElementById('forward-session-list');
          if (list) {
            list.querySelectorAll('.forward-session-item').forEach(el => {
              el.classList.remove('selected');
            });
          }
        });
      }
      if (modal) {
        modal.addEventListener('click', (e) => {
          if (e.target === modal) closeForwardModal();
        });
      }
    })();

    // --- 消息渲染逻辑 ---
    function appendMsgRow(text, isMe, senderId, timeStr, options) {
      const msgsDiv = document.getElementById('messages');
      const opts = options || {};
      const prepend = !!opts.prepend;
      const keepScroll = !!opts.keepScroll;
      
      const row = document.createElement('div');
      row.className = 'msg-row ' + (isMe ? 'me' : 'other');
      const sourceMsg = opts.msg || null;
      row.__msgContext = {
        sessionId: (sourceMsg && sourceMsg.session_id) ||
          opts.sessionId || currentSessionId,
        msgSeq: sourceMsg ? Number(sourceMsg.msg_seq || 0)
                          : Number(opts.msgSeq || 0),
        msgId: (sourceMsg && sourceMsg.msg_id) || opts.msgId || '',
        msgType: (sourceMsg && sourceMsg.msg_type) || opts.msgType || '',
        content: text
      };

      const numericSender = Number(senderId) ||
        (isMe ? Number(currentUserId) : 0);
      const senderProfile = opts.sender || null;
      if (senderProfile && senderProfile.user_id) {
        UserProfile.prime(senderProfile);
      }
      const profileHint = senderProfile || (isMe ? myProfile : null);
      const authNow = Auth.get();
      const fallbackName = isMe
        ? ((profileHint && profileHint.name) ||
           (authNow && authNow.name) || '我')
        : ('User ' + (numericSender || '?'));

      // 头像
      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      UserProfile.applyAvatar(avatar, profileHint, numericSender);

      // 内容包裹
      const wrapper = document.createElement('div');
      wrapper.className = 'msg-content-wrapper';

      // 名字 + 时间
      const name = document.createElement('div');
      name.className = 'msg-name';
      const nameText = document.createElement('span');
      nameText.textContent = (profileHint && profileHint.name) || fallbackName;
      const timeSpan = document.createElement('span');
      timeSpan.className = 'msg-time';
      // 如果没有传入时间，就用当前时间
      timeSpan.textContent = timeStr || new Date().toLocaleTimeString();
      name.appendChild(nameText);
      name.appendChild(timeSpan);
      if (!profileHint && numericSender) {
        UserProfile.hydrate(avatar, numericSender, nameText, fallbackName);
      }
      
      // 气泡
      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      const imageContent = extractImageContent(text);
      const videoContent = imageContent ? null : extractVideoContent(text);
      const fileContent =
        (imageContent || videoContent) ? null : extractFileContent(text);
      // 图片/视频气泡要等 row 挂到 DOM 后再 hydrate：hydrate 函数开头会检查
      // img.isConnected，提前调用会被直接 return，导致封面永远不加载。
      let pendingImage = null;
      let pendingVideo = null;
      if (imageContent) {
        bubble.classList.add('msg-image-bubble');
        const frame = document.createElement('div');
        frame.className = 'msg-image-frame';
        if (imageContent.dominant_color) {
          frame.style.background = imageContent.dominant_color;
        }
        const img = document.createElement('img');
        img.className = 'msg-image-preview';
        img.alt = imageContent.caption || '图片';
        if (imageContent.width && imageContent.height) {
          img.style.aspectRatio =
            imageContent.width + ' / ' + imageContent.height;
        }
        const state = document.createElement('div');
        state.className = 'msg-image-state';
        state.textContent = '加载中...';
        frame.appendChild(img);
        frame.appendChild(state);
        frame.onclick = () => openImageLightbox(imageContent);
        bubble.appendChild(frame);
        if (imageContent.caption) {
          const caption = document.createElement('div');
          caption.className = 'msg-image-caption';
          caption.textContent = imageContent.caption;
          bubble.appendChild(caption);
        }
        pendingImage = { img, state, content: imageContent };
      } else if (videoContent) {
        bubble.classList.add('msg-video-bubble');
        const card = document.createElement('div');
        card.className = 'msg-video-card';
        if (videoContent.width && videoContent.height) {
          card.style.aspectRatio =
            videoContent.width + ' / ' + videoContent.height;
        }
        const poster = document.createElement('img');
        poster.className = 'msg-video-poster';
        poster.alt = videoContent.caption || '视频';
        const state = document.createElement('div');
        state.className = 'msg-video-state';
        state.textContent = '加载中...';
        const play = document.createElement('div');
        play.className = 'msg-video-play';
        play.innerHTML =
          '<svg class="mr-icon" aria-hidden="true"><use href="#i-play"></use></svg>';
        const duration = document.createElement('div');
        duration.className = 'msg-video-duration';
        duration.textContent = formatDuration(videoContent.duration_ms);
        card.appendChild(poster);
        card.appendChild(state);
        card.appendChild(play);
        card.appendChild(duration);
        card.onclick = () => openVideoLightbox(videoContent);
        bubble.appendChild(card);
        if (videoContent.caption) {
          const caption = document.createElement('div');
          caption.className = 'msg-video-caption';
          caption.textContent = videoContent.caption;
          bubble.appendChild(caption);
        }
        pendingVideo = { img: poster, state, content: videoContent };
      } else if (fileContent) {
        bubble.classList.add('msg-file-bubble');
        const card = document.createElement('div');
        card.className = 'msg-file-card';

        const icon = document.createElement('div');
        icon.className = 'msg-file-icon';
        icon.textContent = fileExtension(fileContent.name);
        icon.style.background =
          fileIconColor(fileContent.name, fileContent.mime_type);

        const info = document.createElement('div');
        info.className = 'msg-file-info';
        const nameEl = document.createElement('div');
        nameEl.className = 'msg-file-name';
        nameEl.textContent = fileContent.name || '未命名文件';
        nameEl.title = fileContent.name || '';
        const metaEl = document.createElement('div');
        metaEl.className = 'msg-file-meta';
        const sizeText = fileContent.size_bytes
          ? formatBytes(fileContent.size_bytes) + ' · ' : '';
        metaEl.textContent = sizeText + '点击下载';

        info.appendChild(nameEl);
        info.appendChild(metaEl);
        card.appendChild(icon);
        card.appendChild(info);
        bubble.appendChild(card);
        if (fileContent.caption) {
          const caption = document.createElement('div');
          caption.className = 'msg-file-caption';
          caption.textContent = fileContent.caption;
          bubble.appendChild(caption);
        }
        bubble.title = '下载 ' + (fileContent.name || '文件');
        bubble.onclick = () => downloadFileMessage(fileContent);
      } else {
        bubble.textContent = typeof text === 'string' ? text : String(text);
      }

      wrapper.appendChild(name);
      wrapper.appendChild(bubble);
      
      row.appendChild(avatar);
      row.appendChild(wrapper);
      
      if (prepend && msgsDiv.firstChild) {
        msgsDiv.insertBefore(row, msgsDiv.firstChild);
      } else {
        msgsDiv.appendChild(row);
      }

      if (pendingImage) {
        hydrateImageBubble(pendingImage.img, pendingImage.content, pendingImage.state, 0);
      }
      if (pendingVideo) {
        hydrateVideoPoster(pendingVideo.content, pendingVideo.img, pendingVideo.state, 0);
      }

      if (!prepend && !keepScroll) {
        msgsDiv.scrollTop = msgsDiv.scrollHeight;
      }
    }

    function appendSystemMsg(text) {
      const msgsDiv = document.getElementById('messages');
      const el = document.createElement('div');
      el.className = 'msg-system';
      el.textContent = text;
      msgsDiv.appendChild(el);
      msgsDiv.scrollTop = msgsDiv.scrollHeight;
    }

    // --- 核心业务逻辑 (复用原有逻辑，适配新UI) ---
    
    // 1. 登录/注册
    async function doLoginOrRegister(mode) {
      const account = document.getElementById('account').value.trim();
      const passwordRaw = document.getElementById('password').value;
      const nickname = document.getElementById('nickname').value.trim();
      const statusEl = document.getElementById('login-status');
      
      if (!account || !passwordRaw) {
        statusEl.textContent = '请输入账号和密码';
        return;
      }
      if (passwordRaw.length < 6) {
        statusEl.textContent = '密码至少 6 位';
        return;
      }
      const password = hashPassword(passwordRaw);

      try {
        statusEl.textContent = '请求中...';
        const url = logicBase + (mode === 'register' ? '/api/register' : '/api/login');
        const body = { account, password };
        if (mode === 'register' && nickname) {
             body.name = nickname;
        }

        const resp = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await resp.json();
        
        if (data.code !== 0) {
          statusEl.textContent = data.message;
          return;
        }
        
        // 成功
        currentUserId = data.data.user_id;
        token = data.data.token;
        // 缓存本地：登录响应已经带回数据库里的当前昵称。
        Auth.set(currentUserId, token,
                 data.data.name || body.name || ('User ' + currentUserId));
        
        statusEl.textContent = '';
        
        // 连接 WebSocket
        connectWebSocket();
        // 切换 UI
        updateUIState();
        
      } catch (e) {
        statusEl.textContent = '网络异常: ' + e;
      }
    }

    // 2. WebSocket
    function connectWebSocket() {
      if (!token) return;
      if (wsRetryTimer) { clearTimeout(wsRetryTimer); wsRetryTimer = null; }
      if (ws) {
        // 复用旧连接的 close 事件会误触发重连，先摘掉回调再关闭
        ws.onopen = ws.onmessage = ws.onerror = ws.onclose = null;
        ws.close();
        ws = null;
      }

      wsManualClose = false;
      const socket = new WebSocket(cometWsUrl + '?token=' + encodeURIComponent(token));
      let opened = false;
      ws = socket;

      socket.onopen = () => {
        if (ws !== socket) return;
        console.log('WS Connected');
        opened = true;
        wsRetryCount = 0;
        // 如果在聊天窗口，可以显示一条小提示
        if (currentSessionId) appendSystemMsg('已连接服务器');
      };
      
      socket.onmessage = (ev) => {
        if (ws !== socket) return;
        try {
          const obj = JSON.parse(ev.data);
          if (obj.type === 'ack') {
            // console.log('Ack:', obj.msg_id);
          } else if (obj.type === 'single_chat') {
             // 收到单聊消息
             // const sender = obj.sender_id; // 假设后端下发 sender_id
             
             const imageContent = extractImageContent(obj.content);
             const videoContent = extractVideoContent(obj.content);
             const fileContent = extractFileContent(obj.content);
             const t = getMsgText(obj);
             console.log('obj', obj);
             
             // 尝试解析 client_msg_id 作为时间戳 (临时方案)
             // 最好后端直接下发 send_time
             let timeStr = '';
             if(obj.client_msg_id && /^\d+$/.test(obj.client_msg_id)) {
                timeStr = new Date(parseInt(obj.client_msg_id)).toLocaleTimeString();
             }

             const senderId = Number(obj.from_user_id || obj.sender_id || 0);
             const receiverId = Number(obj.to_user_id || 0);
             const messageSessionId = obj.session_id || (
               obj.msg_id && obj.msg_id.startsWith('single:')
                 ? obj.msg_id.slice(0, obj.msg_id.lastIndexOf('-'))
                 : null
             );
             const expectedSessionId = senderId && receiverId
               ? buildSingleSessionId(senderId, receiverId)
               : null;
             const belongsToCurrentSession = currentSessionId && (
               (messageSessionId && messageSessionId === currentSessionId) ||
               (expectedSessionId && expectedSessionId === currentSessionId) ||
               (!obj.session_id && !receiverId && senderId === Number(currentPeerId))
             );

             if (!belongsToCurrentSession) {
               if (senderId) {
                 UserProfile.get(senderId).then(profile => {
                   showToast('收到 ' + UserProfile.displayName(profile, senderId) +
                             ' 的新消息: ' + t);
                 }).catch(() => {
                   showToast('收到 User ' + senderId + ' 的新消息: ' + t);
                 });
               }
               loadSingleSessionList();
               refreshGlobalUnread();
               setTimeout(loadSingleSessionList, 500);
               setTimeout(loadSingleSessionList, 1500);
               return;
             }

             const isMe = senderId === Number(currentUserId);
             appendMsgRow(videoContent || imageContent || fileContent || t,
                          isMe, senderId, timeStr,
                          { sender: obj.sender, msg: obj });
             // 正在看这个会话：收到即视为已读。
             if (!isMe) markCurrentSessionRead();
          } else if (obj.type === 'system_broadcast') {
             // 处理系统广播
             // scope: "all" 为全局推送；scope: "group" 为房间/群推送
             const scope = obj.scope || 'all';
             // 单聊页面忽略房间级推送（仅群聊/聊天室页面关心）
             if (scope === 'group') {
               console.log('Ignore group-scope broadcast in single-chat page:', obj);
               return;
             }

             let text = '';
             if (obj.content && obj.content.text) text = obj.content.text;
             else if (typeof obj.content === 'string') text = obj.content;
             else text = JSON.stringify(obj.content);
             
             showToast('全员广播: ' + text);
             
             // 同时如果打开了聊天窗口，也显示一条系统消息
             if (currentSessionId) {
                appendSystemMsg('收到全员广播: ' + text);
             }
          } else {
             console.log('Other msg:', obj);
          }
        } catch(e) {
          console.error(e);
        }
      };
      
      socket.onclose = () => {
        if (ws !== socket) return;
        console.log('WS Closed');
        ws = null;
        if (wsManualClose) return;

        if (!opened) {
          verifyTokenAfterHandshakeFailure();
          return;
        }

        scheduleReconnect();
      };
    }

    async function verifyTokenAfterHandshakeFailure() {
      if (!token) return;
      const tokenAtFailure = token;
      try {
        const resp = await fetch(logicBase + '/api/session/list_single', {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify({})
        });
        if (token !== tokenAtFailure) return;
        if (resp.status === 401) {
          handleTokenExpired();
          return;
        }
      } catch (e) {
        console.warn('Token verification unavailable after WS failure:', e);
      }
      if (token === tokenAtFailure) scheduleReconnect();
    }

    // HTTP 明确确认 token 失效后，清理本地会话并引导重新登录
    function handleTokenExpired() {
      Auth.clear();
      ws = null;
      token = null;
      currentUserId = null;
      currentSessionId = null;
      currentPeerId = null;
      showToast('登录状态已失效，请重新登录');
      const statusEl = document.getElementById('login-status');
      if (statusEl) statusEl.textContent = '登录状态已失效，请重新登录';
      updateUIState();
    }

    // 已建连后掉线：指数退避重连，最多 5 次
    function scheduleReconnect() {
      if (!token || wsRetryCount >= 5) {
        if (currentSessionId) appendSystemMsg('连接已断开，请刷新页面重试');
        return;
      }
      const delay = Math.min(1000 * Math.pow(2, wsRetryCount), 16000);
      wsRetryCount++;
      if (currentSessionId) {
        appendSystemMsg('连接断开，' + (delay / 1000) + ' 秒后重连(第 ' + wsRetryCount + ' 次)');
      }
      wsRetryTimer = setTimeout(connectWebSocket, delay);
    }

    // 3. 获取会话列表
    async function loadSingleSessionList() {
      if (!currentUserId) return;
      try {
        const resp = await fetch(logicBase + '/api/session/list_single', {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify({})
        });
        const data = await resp.json();
        if (data.code === 0) {
          renderSessionList(data.data.sessions || []);
        }
      } catch(e) {
        console.error('List session error', e);
      }
    }

    function renderSessionList(list) {
      const container = document.getElementById('session-list');
      container.innerHTML = '';
      if (list.length === 0) {
        container.innerHTML =
          '<div class="session-empty">暂无历史会话<br>请在上方输入 UserID 或昵称</div>';
        return;
      }

      list.forEach(s => {
        const div = document.createElement('div');
        div.className = 'session-item';
        if (s.session_id === currentSessionId) div.classList.add('active');
        div.dataset.sid = s.session_id;

        const peerProfile = {
          user_id: s.peer_user_id,
          name: s.peer_name || '',
          avatar_media_id: s.peer_avatar_media_id || '',
          avatar_url: s.peer_avatar_url || '',
          avatar_expires_at: s.peer_avatar_expires_at || 0
        };
        if (peerProfile.name || peerProfile.avatar_url ||
            peerProfile.avatar_media_id) {
          UserProfile.prime(peerProfile);
        }

        const avatar = document.createElement('div');
        avatar.className = 'avatar-placeholder';
        UserProfile.applyAvatar(avatar, peerProfile, s.peer_user_id);

        const info = document.createElement('div');
        info.className = 'session-info';
        const nameEl = document.createElement('div');
        nameEl.className = 'session-name';
        const fallbackName = 'User ' + s.peer_user_id;
        nameEl.textContent = peerProfile.name || fallbackName;
        if (!peerProfile.name && !peerProfile.avatar_media_id) {
          UserProfile.hydrate(avatar, s.peer_user_id, nameEl, fallbackName);
        }
        const preview = document.createElement('div');
        preview.className = 'session-preview';
        preview.textContent = 'ID ' + s.peer_user_id;
        info.appendChild(nameEl);
        info.appendChild(preview);

        const meta = document.createElement('div');
        meta.className = 'session-meta';
        const badge = document.createElement('span');
        badge.className = 'unread-badge';
        setUnreadBadge(badge, s.unread);
        meta.appendChild(badge);

        div.appendChild(avatar);
        div.appendChild(info);
        div.appendChild(meta);
        div.onclick = () => {
          showChatWindow(s.peer_user_id, s.session_id);
        };
        container.appendChild(div);
      });
    }
    
    // 4. 开启新会话 (build ID)
    function buildSingleSessionId(u1, u2) {
       const a = Number(u1); const b = Number(u2);
       if(!a || !b) return null;
       return 'single:' + Math.min(a,b) + ':' + Math.max(a,b);
    }
    
    // 5. 历史记录（支持分页 / 滚动加载）
    async function loadHistory(isInitial) {
       if (!currentSessionId) return;
       if (historyLoading) return;

       // 非首次加载且没有更多历史时，直接返回
       if (!isInitial && (!historyHasMore || !historyAnchorSeq)) return;

       historyLoading = true;
       const pageSize = 50;
       const anchor = isInitial ? 0 : historyAnchorSeq;

       try {
         const resp = await fetch(logicBase + '/api/session/history', {
           method: 'POST',
           headers: authHeaders(),
           body: JSON.stringify({
             session_id: currentSessionId,
             anchor_seq: anchor,
             limit: pageSize
           })
         });
         const data = await resp.json();
         if (data.code !== 0) {
           historyLoading = false;
           appendSystemMsg('加载历史失败: ' + data.message);
           return;
         }

         const msgs = data.data.messages || [];
         if (msgs.length === 0) {
           if (isInitial) {
             appendSystemMsg('暂无历史消息');
             markCurrentSessionRead();
           }
           historyHasMore = false;
           historyLoading = false;
           return;
         }

         const container = document.getElementById('messages');
         const oldScrollHeight = container.scrollHeight;

         // 展示层始终按 msg_seq 从小到大排列，不依赖接口返回顺序。
         // 首次加载按升序 append；向上翻页时按降序逐条 prepend，
         // 最终 DOM 仍保持旧消息在上、新消息在下。
         const ascendingMsgs = [...msgs].sort(
           (a, b) => Number(a.msg_seq || 0) - Number(b.msg_seq || 0)
         );
         const orderedMsgs = isInitial
           ? ascendingMsgs
           : [...ascendingMsgs].reverse();
         orderedMsgs.forEach(m => {
           lastHistorySeq = Math.max(lastHistorySeq, m.msg_seq || 0);
           const isMe = (m.sender_id === currentUserId);
           const text = getMsgText(m);
           const imageContent = extractImageContent(m.content);
           const videoContent = extractVideoContent(m.content);
           const fileContent = extractFileContent(m.content);
           // history 批量接口会把 media 元数据挂在消息上；
           // 挂到 content 上，hydrate 时优先使用，避免逐张再 GET。
           if (imageContent && m.media) imageContent.media = m.media;
           if (videoContent && m.media) videoContent.media = m.media;
           if (fileContent && m.media) fileContent.media = m.media;
           const renderContent =
             videoContent || imageContent || fileContent || text;

           const timeStr = m.timestamp_ms ? new Date(m.timestamp_ms).toLocaleTimeString() : '';
           const sender = m.sender || null;
           if (sender && sender.user_id) UserProfile.prime(sender);

           if (isInitial) {
             appendMsgRow(renderContent, isMe, m.sender_id, timeStr,
                          { sender, msg: m });
           } else {
             appendMsgRow(renderContent, isMe, m.sender_id, timeStr,
                          { prepend: true, keepScroll: true, sender, msg: m });
           }
         });

         // 下一页查询 < 本批次最小 msg_seq。
         const oldest = ascendingMsgs[0];
         if (oldest && Number.isFinite(Number(oldest.msg_seq))) {
           historyAnchorSeq = Number(oldest.msg_seq);
         }
         historyHasMore = msgs.length >= pageSize && historyAnchorSeq > 1;

         if (!isInitial) {
           const newScrollHeight = container.scrollHeight;
           container.scrollTop = newScrollHeight - oldScrollHeight;
         } else {
           // 打开会话即自动已读，避免用户在看消息时角标还挂着。
           markCurrentSessionRead();
         }
       } catch(e) {
         appendSystemMsg('加载历史失败: ' + e);
       } finally {
         historyLoading = false;
       }
    }

    // 6. 发送消息
    async function sendMsg() {
       const text = document.getElementById('msg-text').value.trim();
       if (!text || !currentPeerId) return;
       if (!token) {
         appendSystemMsg('登录状态已失效，请重新登录后再发送');
         return;
       }
       try {
         // 文本也走 HTTP 发送：立即拿到 msg_seq，消息右键可直接转发；
         // 接收方仍然通过 Kafka -> Job -> Comet 实时收到。
         const sent = await apiPost('/api/message/send', {
           to_user_id: Number(currentPeerId),
           msg_type: 'text',
           content: text
         });
         appendMsgRow(text, true, currentUserId, undefined, {
           msg: {
             session_id: sent.session_id,
             msg_id: sent.msg_id,
             msg_seq: sent.msg_seq,
             msg_type: 'text',
             content: text
           }
         });
         document.getElementById('msg-text').value = '';
       } catch (e) {
         appendSystemMsg('消息发送失败: ' + (e && e.message ? e.message : e));
       }
    }

    // 辅助：解析消息内容
    function getMsgText(obj) {
       if (!obj.content) return '[空]';
       const imageContent = extractImageContent(obj.content);
       if (imageContent) {
         return imageContent.caption ? '[图片] ' + imageContent.caption : '[图片]';
       }
       const videoContent = extractVideoContent(obj.content);
       if (videoContent) {
         return '[视频] ' + (videoContent.caption || '');
       }
       const fileContent = extractFileContent(obj.content);
       if (fileContent) {
         return '[文件] ' + (fileContent.name || '未命名文件');
       }
       try {
         // 兼容 content 是 string 或 object
         const c = (typeof obj.content === 'string') ? JSON.parse(obj.content) : obj.content;
         
         // 1. 直接包含 text (如 HTTP 发送的消息)
         if (c.text) return c.text;
         
         // 2. 嵌套结构 (如 WebSocket 上行存库后的数据，外层包裹了 msg_id 等)
         if (c.content) {
            // 可能是 {content: {text: "..."}}
            if (typeof c.content === 'object' && c.content.text) return c.content.text;
            // 可能是 {content: "..."}
            if (typeof c.content === 'string') return c.content;
         }
         
         return JSON.stringify(c);
       } catch(e) {
         return String(obj.content);
       }
    }
    
    // 刷新当前会话未读数（只读，不改变读游标）。
    async function refreshUnread() {
      if (!currentSessionId) return;
      try {
        const data = await apiPost('/api/session/unread',
                                   { session_id: currentSessionId });
        const count = Number(data.unread) || 0;
        document.getElementById('unread-count').textContent = String(count);
        const seq = Number(data.last_msg_seq) || 0;
        if (seq > 0) lastHistorySeq = Math.max(lastHistorySeq, seq);
      } catch (e) {
        console.warn('refresh unread failed', e);
      }
    }

    // 把当前会话的读游标推进到最新一条；服务端会做单调保护。
    async function markCurrentSessionRead() {
      if (!currentSessionId) return;
      const sid = currentSessionId;
      try {
        const data = await apiPost('/api/session/unread', { session_id: sid });
        const seq = Number(data.last_msg_seq) || 0;
        if (seq > 0) {
          await apiPost('/api/session/mark_read',
                        { session_id: sid, read_seq: seq });
        }
        if (currentSessionId === sid) {
          document.getElementById('unread-count').textContent = '0';
        }
        loadSingleSessionList();
        refreshGlobalUnread();
      } catch (e) {
        console.warn('mark session read failed', e);
      }
    }

    document.getElementById('mark-read-btn').onclick = async () => {
      if (!currentSessionId) return;
      await markCurrentSessionRead();
      appendSystemMsg('已标记已读');
    };

      container.appendChild(div);

        });
      }, 3000);
    }

    // 通过服务端鉴权后打开单聊（会校验用户存在且双方是好友）。
    async function openSingleChat(peerId) {
      const data = await apiPost('/api/session/open_single',
                                 { peer_user_id: Number(peerId) });
      if (data.peer && data.peer.user_id) UserProfile.prime(data.peer);
      await loadSingleSessionList();
      showChatWindow(
        data.peer && data.peer.user_id ? data.peer.user_id : Number(peerId),

    document.getElementById('start-chat-btn').onclick = async () => {
      const keyword = document.getElementById('to-user').value.trim();
      if (!keyword) return alert('请输入 UserID 或昵称');
      if (!currentUserId) return alert('请先登录');

      if (!/^\d+$/.test(keyword)) {
        // 昵称可能重名：统一进入联系人页，列出所有同名用户供选择。
        window.location.href =
          'contacts.html?search=' + encodeURIComponent(keyword);
        return;
      }

      try {
        // 纯数字也先查库，确认用户存在再打开会话。
        const data = await apiPost('/api/user/search', { keyword });
        const users = data.users || [];
        if (users.length === 0) {
          alert('用户不存在: ' + keyword);
          return;
        }
        const user = users[0];
        if (user.relationship === 'self') {
          alert('不能和自己聊天');
          return;
        }
        if (user.relationship === 'friend') {
          await openSingleChat(user.user_id);
          return;
        }
        // 还不是好友：去联系人页发送好友申请。
        window.location.href =
          'contacts.html?search=' + encodeURIComponent(keyword);
      } catch (e) {
        alert('查询用户失败: ' + (e && e.message ? e.message : e));
      }
    };

      if (e.target && e.target.id === 'image-lightbox') closeImageLightbox();
    };
    document.getElementById('video-lightbox-close').onclick = closeVideoLightbox;
    document.getElementById('video-lightbox').onclick = (e) => {
      if (e.target && e.target.id === 'video-lightbox') closeVideoLightbox();
    };
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        setAttachPanel(false);
        closeImageLightbox();
        closeVideoLightbox();
      }
    });

    // 点击“拉取更多历史”按钮时，向前分页加载
    document.getElementById('load-more-btn').onclick = () => {
      loadHistory(false);
    };

    // 上滑到顶部时自动加载更多历史
    document.getElementById('messages').addEventListener('scroll', function() {
      if (this.scrollTop < 40 && !historyLoading && historyHasMore && currentSessionId) {
        loadHistory(false);
      }
    });

    // 初始化
    const savedSession = Auth.get();
    if (savedSession) {
      // LocalStorage 存的是字符串，后端 API 强校验 user_id 为 number (int64)
      currentUserId = Number(savedSession.user_id);
      token = savedSession.token;
      connectWebSocket();
      // WebSocket 握手失败后会通过 HTTP 再确认 token，只有明确 401 才清理会话
    }
    updateUIState();

    // 从联系人页跳转过来时直接打开对应单聊。
    const peerParam = new URLSearchParams(window.location.search).get('peer');
    if (savedSession && peerParam && /^\d+$/.test(peerParam)) {
      openSingleChat(peerParam).catch(e => {
        showToast('打开会话失败: ' + (e && e.message ? e.message : e));
      });
    }
  </script>
</body>
</html>
